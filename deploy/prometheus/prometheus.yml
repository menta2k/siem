global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: siem-api
    static_configs: [{ targets: ["siem-api:8000"] }]
    metrics_path: /metrics

  - job_name: siem-ingest
    static_configs: [{ targets: ["siem-ingest:8001"] }]
    metrics_path: /metrics

  - job_name: siem-processor
    static_configs: [{ targets: ["siem-processor:8002"] }]
    metrics_path: /metrics
