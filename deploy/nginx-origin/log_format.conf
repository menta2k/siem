# nginx log_format for the SIEM origin feed.
#
# Include this from the `http` block, then set `access_log /var/log/nginx/siem.log siem;`
# on the servers you want correlated. Keep the existing access_log too if anything else
# consumes it — this is an additional format, not a replacement.
#
# WHY A CUSTOM FORMAT IS REQUIRED
#
# The two fields correlation depends on are absent from `combined`, and no amount of
# parsing recovers them:
#
#   $http_cf_ray            the join key. Cloudflare sets CF-Ray on the request it sends
#                           to the origin, F5 passes it through, so nginx sees exactly
#                           the identifier F5 keys on. Without it an nginx event can
#                           only join by the heuristic IP/host/path/time match, which is
#                           where all the false-join risk lives.
#
#   $http_cf_connecting_ip  the real client. $remote_addr is the BIG-IP on every single
#                           request, so a log without this attributes all traffic to the
#                           load balancer.
#
# JSON rather than a text layout: the platform's adapter refuses a line it cannot read
# rather than guessing at field positions, so a format change shows up as a visible
# dead-letter instead of events quietly carrying the wrong values.
#
# escape=json is NOT optional. A user agent or URI containing a quote or a backslash
# would otherwise produce a line that is not valid JSON, and an attacker controls both.

log_format siem escape=json
  '{'
    '"time_iso8601":"$time_iso8601",'
    '"cf_ray":"$http_cf_ray",'
    '"cf_connecting_ip":"$http_cf_connecting_ip",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"server_name":"$server_name",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer",'
    '"scheme":"$scheme",'
    '"server_protocol":"$server_protocol",'
    '"request_time":"$request_time",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_length":$request_length'
  '}';
