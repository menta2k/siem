# Security headers, kept in one file because nginx does NOT cascade add_header.
#
# A location block containing any add_header of its own discards every add_header
# inherited from the server block — silently, with no warning. Setting these once at
# server level therefore protects only the locations that happen to add no header of
# their own, and a later Cache-Control line in `location /` is enough to strip the CSP
# from every page the SPA serves. Including this file explicitly in each location is
# what makes that impossible to get wrong by accident.
#
# These MUST match frontend/vite.config.ts's SECURITY_HEADERS. frame-ancestors is the
# one that cannot come from a <meta> tag — browsers ignore it there — so clickjacking
# protection exists only as a real response header.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
