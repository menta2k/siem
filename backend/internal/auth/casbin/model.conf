# RBAC with domains, where the domain IS the tenant.
#
# Encoding the tenant as the domain means an authorization check cannot succeed
# against the wrong tenant even if a handler passes the wrong object: the enforcer
# compares r.dom to p.dom on every request. Tenant scoping is therefore part of the
# permission model rather than an extra condition each call site must remember.
#
# Effect is deny-by-default: a request matching no policy line is denied, so a newly
# added endpoint is unreachable until someone grants access to it deliberately.

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# keyMatch2, not keyMatch. keyMatch treats a trailing `*` as matching everything that
# follows, so a policy line for `/api/v1/admin/*` would silently grant every admin
# route added in future — the exact opposite of deny-by-default. keyMatch2's `:param`
# matches a SINGLE path segment, so each route must be granted explicitly.
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && keyMatch2(r.obj, p.obj) && (r.act == p.act || p.act == "*")
