                    application/json:
                        schema:
                            $ref: '#/components/schemas/TestFeedRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TestFeedResponse'
    /api/v1/search/correlated:
