        post:
            tags:
                - Search
            description: |-
                Streamed and row-capped. Audited with the actor, the query, and the row count,
                 because an export removes data from the platform's control (FR-026).
            operationId: Search_ExportSearch
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExportSearchRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExportSearchResponse'
components:
    schemas:
        AcknowledgeAlertRequest:
            type: object
            properties:
                alertId:
                    type: string
                note:
                    type: string
        Alert:
            type: object
            properties:
                alertId:
                    type: string
                ruleId:
                    type: string
                ruleName:
                    type: string
                firedAt:
                    type: string
                    format: date-time
                severity:
                    enum:
                        - SEVERITY_UNSPECIFIED
                        - SEVERITY_LOW
                        - SEVERITY_MEDIUM
                        - SEVERITY_HIGH
                        - SEVERITY_CRITICAL
                    type: string
                    format: enum
                state:
                    enum:
                        - ALERT_STATE_UNSPECIFIED
                        - ALERT_STATE_NEW
                        - ALERT_STATE_ACKNOWLEDGED
                        - ALERT_STATE_RESOLVED
                    type: string
                    format: enum
                groupValues:
                    type: object
                    additionalProperties:
                        type: string
                observedValue:
                    type: number
                    format: double
                threshold:
                    type: number
                    format: double
                evidenceCorrelationIds:
                    type: array
                    items:
                        type: string
                    description: |-
                        Links to the correlated records that caused the alert, so an operator opens the
                         evidence rather than reconstructing the query behind a number (SC-006).
                acknowledgedBy:
                    type: string
                acknowledgedAt:
                    type: string
                    format: date-time
                resolvedBy:
                    type: string
                resolvedAt:
                    type: string
                    format: date-time
                notifyStatus:
                    enum:
                        - NOTIFY_STATUS_UNSPECIFIED
                        - NOTIFY_STATUS_PENDING
                        - NOTIFY_STATUS_DELIVERED
                        - NOTIFY_STATUS_FAILED
                    type: string
                    format: enum
                notifyAttempts:
                    type: integer
                    format: uint32
                notifyLastError:
                    type: string
                    description: |-
                        The last delivery error, shown in the console so a failure is visible where the
                         alert is rather than only in a log an analyst cannot read.
        AlertRule:
            type: object
            properties:
                ruleId:
                    type: string
                name:
                    type: string
                enabled:
                    type: boolean
                severity:
                    enum:
                        - SEVERITY_UNSPECIFIED
                        - SEVERITY_LOW
                        - SEVERITY_MEDIUM
                        - SEVERITY_HIGH
                        - SEVERITY_CRITICAL
                    type: string
                    format: enum
                condition:
                    $ref: '#/components/schemas/RuleCondition'
                webhookUrl:
                    type: string
                webhookSigningConfigured:
                    type: boolean
                    description: True when a signing secret is configured. The secret itself is NEVER returned.
                createdBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        AuditEntry:
            type: object
            properties:
                entryId:
                    type: string
                occurredAt:
                    type: string
                    format: date-time
                actorEmail:
                    type: string
                sourceIp:
                    type: string
                action:
                    type: string
                targetType:
                    type: string
                targetId:
                    type: string
                beforeValue:
                    type: string
                afterValue:
                    type: string
                result:
                    type: string
                detail:
                    type: string
                entryHash:
                    type: string
                    description: |-
                        The hash chain. Exposed so a reader can verify the LINKAGE themselves rather than
                         take the platform's word for it — an audit trail whose integrity can only be
                         confirmed by the system that wrote it is not evidence.

                         Checking these proves no entry was removed from the middle of a range: a deletion
                         breaks the chain where it happened. It does NOT prove the whole range was not
                         rewritten from the start; that needs the server-held anchor.
                previousHash:
                    type: string
        ClientInfo:
            type: object
            properties:
                ip:
                    type: string
                ipShared:
                    type: boolean
                    description: |-
                        True when the address looks like NAT, a proxy chain, or a carrier range. This
                         downgrades join confidence rather than silently weakening the match.
                asn:
                    type: integer
                    format: uint32
                country:
                    type: string
                userAgent:
                    type: string
            description: ClientInfo describes the requesting client as normalized across vendors.
        CorrelatedFilters:
            type: object
            properties:
                clientIp:
                    type: string
                requestHost:
                    type: string
                requestPath:
                    type: string
                country:
                    type: string
                asn:
                    type: integer
                    format: uint32
                minVendorCount:
                    type: integer
                    description: Above 1 restricts the result to genuine cross-vendor joins.
                    format: uint32
                onlyDisagreements:
                    type: boolean
                disagreementKind:
                    enum:
                        - DISAGREEMENT_KIND_UNSPECIFIED
                        - DISAGREEMENT_KIND_NONE
                        - DISAGREEMENT_KIND_ALLOW_VS_BLOCK
                        - DISAGREEMENT_KIND_ALLOW_VS_CHALLENGE
                        - DISAGREEMENT_KIND_SCORE_CONFLICT
                    type: string
                    format: enum
                confidence:
                    enum:
                        - CONFIDENCE_UNSPECIFIED
                        - CONFIDENCE_HIGH
                        - CONFIDENCE_MEDIUM
                        - CONFIDENCE_LOW
                    type: string
                    format: enum
                combinedOutcome:
                    enum:
                        - VERDICT_UNSPECIFIED
                        - VERDICT_ALLOWED
                        - VERDICT_BLOCKED
                        - VERDICT_CHALLENGED
                        - VERDICT_RATE_LIMITED
                        - VERDICT_MONITORED
                        - VERDICT_UNKNOWN
                    type: string
                    format: enum
            description: CorrelatedFilters add the join-level facets to the event filters.
        CorrelatedRequest:
            type: object
            properties:
                correlationId:
                    type: string
                windowStart:
                    type: string
                    format: date-time
                firstEventTime:
                    type: string
                    format: date-time
                lastEventTime:
                    type: string
                    format: date-time
                client:
                    $ref: '#/components/schemas/ClientInfo'
                request:
                    $ref: '#/components/schemas/RequestInfo'
                vendorVerdicts:
                    type: array
                    items:
                        $ref: '#/components/schemas/VendorVerdict'
                    description: |-
                        One entry per contributing vendor, so a disagreement can be read directly off
                         the record rather than inferred from a flattened summary.
                vendorCount:
                    type: integer
                    description: '1 is normal, not an error: plenty of hostnames sit behind a single vendor (FR-016).'
                    format: uint32
                eventIds:
                    type: array
                    items:
                        type: string
                    description: Ids of the contributing events, for drilling through to the raw payloads (FR-024).
                combinedOutcome:
                    enum:
                        - VERDICT_UNSPECIFIED
                        - VERDICT_ALLOWED
                        - VERDICT_BLOCKED
                        - VERDICT_CHALLENGED
                        - VERDICT_RATE_LIMITED
                        - VERDICT_MONITORED
                        - VERDICT_UNKNOWN
                    type: string
                    description: The most restrictive verdict any vendor reached.
                    format: enum
                hasDisagreement:
                    type: boolean
                disagreementKind:
                    enum:
                        - DISAGREEMENT_KIND_UNSPECIFIED
                        - DISAGREEMENT_KIND_NONE
                        - DISAGREEMENT_KIND_ALLOW_VS_BLOCK
                        - DISAGREEMENT_KIND_ALLOW_VS_CHALLENGE
                        - DISAGREEMENT_KIND_SCORE_CONFLICT
                    type: string
                    format: enum
                joinSignals:
                    type: array
                    items:
                        enum:
                            - JOIN_SIGNAL_UNSPECIFIED
                            - JOIN_SIGNAL_VENDOR_REQUEST_ID
                            - JOIN_SIGNAL_IP_HOST_PATH_METHOD
                            - JOIN_SIGNAL_TIME_WINDOW
                        type: string
                        format: enum
                joinTier:
                    type: integer
                    description: 1 = exact shared request id, 2 = heuristic match.
                    format: uint32
                confidence:
                    enum:
                        - CONFIDENCE_UNSPECIFIED
                        - CONFIDENCE_HIGH
                        - CONFIDENCE_MEDIUM
                        - CONFIDENCE_LOW
                    type: string
                    format: enum
                candidateCount:
                    type: integer
                    description: Above 1, several events competed for the join and the chosen one may be wrong.
                    format: uint32
                version:
                    type: string
                    description: |-
                        Increments each time a late arrival amends the record. The correlation_id never
                         changes, so a bookmarked record stays findable.
                amended:
                    type: boolean
            description: CorrelatedRequest is one request as every vendor that saw it reported it.
        CorrelationSettings:
            type: object
            properties:
                correlationWindowMs:
                    type: integer
                    description: How far apart two events may be and still describe the same request.
                    format: uint32
                latenessBoundMs:
                    type: integer
                    description: How late an event may arrive and still amend an existing correlated record.
                    format: uint32
                signalRanking:
                    type: array
                    items:
                        enum:
                            - JOIN_SIGNAL_UNSPECIFIED
                            - JOIN_SIGNAL_VENDOR_REQUEST_ID
                            - JOIN_SIGNAL_IP_HOST_PATH_METHOD
                            - JOIN_SIGNAL_TIME_WINDOW
                        type: string
                        format: enum
                    description: Ranked join signals, most trusted first.
        CreateAlertRuleRequest:
            type: object
            properties:
                name:
                    type: string
                severity:
                    enum:
                        - SEVERITY_UNSPECIFIED
                        - SEVERITY_LOW
                        - SEVERITY_MEDIUM
                        - SEVERITY_HIGH
                        - SEVERITY_CRITICAL
                    type: string
                    format: enum
                condition:
                    $ref: '#/components/schemas/RuleCondition'
                webhookUrl:
                    type: string
                webhookSecret:
                    type: string
                    description: Accepted here, stored in the secret manager, and never echoed back.
                enabled:
                    type: boolean
        CreateFeedRequest:
            type: object
            properties:
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                name:
                    type: string
                deliveryMode:
                    enum:
                        - DELIVERY_MODE_UNSPECIFIED
                        - DELIVERY_MODE_PUSH
                        - DELIVERY_MODE_PULL
                    type: string
                    format: enum
                credential:
                    type: string
                    description: Write-only. Supplied once, stored in the secret manager, never read back.
                signingSecret:
                    type: string
                    description: Optional HMAC key for vendors that sign their deliveries.
                pullConfig:
                    type: string
                quotaEventsPerSec:
                    type: integer
                    format: uint32
                quotaBytesPerDay:
                    type: string
        CreateUserRequest:
            type: object
            properties:
                email:
                    type: string
                password:
                    type: string
                role:
                    type: string
        DeleteAlertRuleResponse:
            type: object
            properties:
                disabled:
                    type: boolean
        DeleteFeedResponse:
            type: object
            properties: {}
        DeleteUserResponse:
            type: object
            properties: {}
        DisagreementPoint:
            type: object
            properties:
                bucket:
                    type: string
                    format: date-time
                kind:
                    enum:
                        - DISAGREEMENT_KIND_UNSPECIFIED
                        - DISAGREEMENT_KIND_NONE
                        - DISAGREEMENT_KIND_ALLOW_VS_BLOCK
                        - DISAGREEMENT_KIND_ALLOW_VS_CHALLENGE
                        - DISAGREEMENT_KIND_SCORE_CONFLICT
                    type: string
                    format: enum
                records:
                    type: string
                total:
                    type: string
                    description: |-
                        Every correlated request in the bucket. Carried alongside the numerator so a rate
                         can be computed from one row rather than by dividing figures fetched separately,
                         which is how two panels on one screen end up disagreeing.
        DisagreementsPanel:
            type: object
            properties:
                points:
                    type: array
                    items:
                        $ref: '#/components/schemas/DisagreementPoint'
                totalRecords:
                    type: string
                totalDisagreements:
                    type: string
        EventDetail:
            type: object
            properties:
                summary:
                    $ref: '#/components/schemas/EventSummary'
                rawPayload:
                    type: string
                    description: |-
                        The vendor payload exactly as received, written before any parsing was attempted
                         so a parse failure can never cost the original (FR-005).
                rawContentType:
                    type: string
                rawExtra:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Vendor-native fields with no common-model home (FR-012).

                         Reconstructed from raw_payload on read rather than stored: it is a parsed view of
                         those same bytes, and keeping both cost 12.79 GiB to say twice what the payload
                         already said once. The tenant's redaction policy is re-applied when it is rebuilt,
                         so a masked field is masked here exactly as it was when stored.
                correlationId:
                    type: string
                    description: Set when this event was correlated with others, for drill-through.
                unknownFields:
                    type: array
                    items:
                        type: string
                    description: |-
                        Vendor fields the adapter did not recognise, for the event being inspected.
                         Reconstructed alongside raw_extra from the same parse.
            description: EventDetail is one event with everything the platform holds about it.
        EventFilters:
            type: object
            properties:
                clientIp:
                    type: string
                requestHost:
                    type: string
                requestPath:
                    type: string
                vendor:
                    type: array
                    items:
                        enum:
                            - VENDOR_UNSPECIFIED
                            - VENDOR_CLOUDFLARE
                            - VENDOR_F5
                            - VENDOR_DATADOME
                            - VENDOR_NGINX
                        type: string
                        format: enum
                verdict:
                    type: array
                    items:
                        enum:
                            - VERDICT_UNSPECIFIED
                            - VERDICT_ALLOWED
                            - VERDICT_BLOCKED
                            - VERDICT_CHALLENGED
                            - VERDICT_RATE_LIMITED
                            - VERDICT_MONITORED
                            - VERDICT_UNKNOWN
                        type: string
                        format: enum
                ruleId:
                    type: string
                minScore:
                    type: number
                    format: float
                maxScore:
                    type: number
                    format: float
                country:
                    type: string
                asn:
                    type: integer
                    format: uint32
                userAgent:
                    type: string
                q:
                    type: string
                    description: |-
                        Free-text match across the request path and user agent, backed by the token bloom
                         indexes. Not a general full-text search: a substring scan over every column could
                         not meet the latency budget and would quietly become the slowest query in the app.
                vendorRequestId:
                    type: string
                requestMethod:
                    type: string
                httpStatus:
                    type: integer
                    format: uint32
                vendorEventId:
                    type: string
                    description: |-
                        The vendor's OWN reference for its record, as opposed to vendor_request_id which
                         is the identifier shared between vendors. F5's support_id.
            description: |-
                EventFilters are the cross-vendor filters an analyst can apply.

                 Every field here is optional and every one is validated against an allowlist before
                 it reaches SQL. Unset fields are omitted from the query rather than matched against
                 an empty string, so a blank filter widens nothing.
        EventSummary:
            type: object
            properties:
                eventId:
                    type: string
                eventTime:
                    type: string
                    format: date-time
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                feedId:
                    type: string
                vendorRequestId:
                    type: string
                vendorEventId:
                    type: string
                client:
                    $ref: '#/components/schemas/ClientInfo'
                request:
                    $ref: '#/components/schemas/RequestInfo'
                verdict:
                    enum:
                        - VERDICT_UNSPECIFIED
                        - VERDICT_ALLOWED
                        - VERDICT_BLOCKED
                        - VERDICT_CHALLENGED
                        - VERDICT_RATE_LIMITED
                        - VERDICT_MONITORED
                        - VERDICT_UNKNOWN
                    type: string
                    format: enum
                verdictReason:
                    type: string
                ruleId:
                    type: string
                ruleIds:
                    type: array
                    items:
                        type: string
                score:
                    type: number
                    format: float
                scoreKind:
                    type: string
            description: |-
                EventSummary is one search hit.

                 Deliberately narrower than the detail view: the raw vendor payload is excluded, so a
                 thousand-row page stays kilobytes rather than tens of megabytes. GetEvent fetches
                 the payload for the one row an analyst opens.
        ExportSearchRequest:
            type: object
            properties:
                timeRange:
                    $ref: '#/components/schemas/TimeRange'
                filters:
                    $ref: '#/components/schemas/EventFilters'
                format:
                    enum:
                        - EXPORT_FORMAT_UNSPECIFIED
                        - EXPORT_FORMAT_NDJSON
                        - EXPORT_FORMAT_CSV
                    type: string
                    format: enum
                maxRows:
                    type: integer
                    description: Capped server-side regardless of what is requested.
                    format: uint32
        ExportSearchResponse:
            type: object
            properties:
                content:
                    type: string
                    description: The export content, streamed to the caller.
                    format: bytes
                contentType:
                    type: string
                filename:
                    type: string
                rowCount:
                    type: string
                    description: |-
                        Signed, matching PageResponse.total: row counts are one concept and should not
                         change type depending on which message carries them.
                truncated:
                    type: boolean
                    description: |-
                        True when the export stopped at the row cap, so the caller knows the file is a
                         prefix of the result rather than all of it.
        Feed:
            type: object
            properties:
                feedId:
                    type: string
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                name:
                    type: string
                deliveryMode:
                    enum:
                        - DELIVERY_MODE_UNSPECIFIED
                        - DELIVERY_MODE_PUSH
                        - DELIVERY_MODE_PULL
                    type: string
                    format: enum
                enabled:
                    type: boolean
                credentialConfigured:
                    type: boolean
                    description: True when a credential is configured. The credential itself is NEVER returned.
                signingConfigured:
                    type: boolean
                pullConfig:
                    type: string
                quotaEventsPerSec:
                    type: integer
                    format: uint32
                quotaBytesPerDay:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                health:
                    allOf:
                        - $ref: '#/components/schemas/FeedHealth'
                    description: Populated on list and get so the console can show status without a second call.
        FeedHealth:
            type: object
            properties:
                feedId:
                    type: string
                lastEventAt:
                    type: string
                    format: date-time
                silent:
                    type: boolean
                    description: True when nothing has arrived for longer than the expected interval.
                eventsPerSec:
                    type: number
                    format: double
                eventsReceived1h:
                    type: string
                eventsRejected1h:
                    type: string
                duplicatesSuppressed1h:
                    type: string
                bytesReceived1h:
                    type: string
                maxIngestLagMs:
                    type: integer
                    format: uint32
                credentialValid:
                    type: boolean
                schemaDriftWarning:
                    type: boolean
                    description: Set when unrecognized vendor fields crossed the drift threshold (FR-012).
                driftFields:
                    type: array
                    items:
                        type: string
            description: |-
                FeedHealth answers "is this feed working" (FR-008).

                 Silence detection lives here because a feed that stopped sending looks exactly like
                 clean traffic on a dashboard. `silent` is what distinguishes them.
        FeedHealthPanel:
            type: object
            properties:
                feeds:
                    type: array
                    items:
                        $ref: '#/components/schemas/FeedHealth'
        IngestFilterRule:
            type: object
            properties:
                field:
                    type: string
                    description: 'One of: request_host, request_path.'
                op:
                    type: string
                    description: |-
                        One of: equals, suffix, prefix, contains. Matching ignores case, because hostnames
                         are case-insensitive and extensions arrive in both cases from real traffic.
                values:
                    type: array
                    items:
                        type: string
                    description: Any value matching drops the event, as does any rule — the whole set is an OR.
            description: |-
                IngestFilterRule excludes matching events from ingestion entirely.

                 A matched event is stored NOWHERE — no raw payload, no normalized row, no rejection —
                 so the only trace it leaves is the filtered counter on feed health. That is why the
                 vocabulary is closed and literal rather than a regular expression: a rule an operator
                 can misread is a rule that silently deletes the traffic they needed, and unlike every
                 other loss in this system there is no copy to recover from.
        ListAlertRulesResponse:
            type: object
            properties:
                rules:
                    type: array
                    items:
                        $ref: '#/components/schemas/AlertRule'
        ListAlertsResponse:
            type: object
            properties:
                alerts:
                    type: array
                    items:
                        $ref: '#/components/schemas/Alert'
                page:
                    $ref: '#/components/schemas/PageResponse'
        ListAuditEntriesResponse:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/AuditEntry'
                page:
                    $ref: '#/components/schemas/PageResponse'
                chainIntact:
                    type: boolean
                    description: |-
                        False when the hash chain over the returned range does not verify, meaning an
                         entry was altered or removed.
        ListCorrelatedRequestsResponse:
            type: object
            properties:
                requests:
                    type: array
                    items:
                        $ref: '#/components/schemas/CorrelatedRequest'
                page:
                    $ref: '#/components/schemas/PageResponse'
        ListFeedsResponse:
            type: object
            properties:
                feeds:
                    type: array
                    items:
                        $ref: '#/components/schemas/Feed'
        ListRejectedEventsResponse:
            type: object
            properties:
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/RejectedEvent'
                page:
                    $ref: '#/components/schemas/PageResponse'
        ListUsersResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/UserProfile'
                page:
                    $ref: '#/components/schemas/PageResponse'
        LoginRequest:
            type: object
            properties:
                email:
                    type: string
                password:
                    type: string
        LoginResponse:
            type: object
            properties:
                mfaChallengeToken:
                    type: string
                    description: Short-lived token proving the password step succeeded. Grants nothing else.
                mfaEnrolmentRequired:
                    type: boolean
                    description: True on first login, when the client must render the enrolment QR code.
                mfaProvisioningUri:
                    type: string
                    description: Populated only during enrolment, and never again afterwards.
        LogoutRequest:
            type: object
            properties:
                refreshToken:
                    type: string
        LogoutResponse:
            type: object
            properties: {}
        MeResponse:
            type: object
            properties:
                user:
                    $ref: '#/components/schemas/UserProfile'
        OverviewPanel:
            type: object
            properties:
                volume:
                    type: array
                    items:
                        $ref: '#/components/schemas/VolumePoint'
                verdicts:
                    type: array
                    items:
                        $ref: '#/components/schemas/VerdictPoint'
                totalEvents:
                    type: string
                    description: |-
                        Totals for the whole range, so a headline figure does not require the client to
                         re-sum the series and risk disagreeing with it.
                totalBlocked:
                    type: string
                totalChallenged:
                    type: string
        PageRequest:
            type: object
            properties:
                cursor:
                    type: string
                    description: Opaque cursor from a previous PageResponse. Empty requests the first page.
                limit:
                    type: integer
                    description: Server caps this at QUERY_MAX_RESULT_ROWS regardless of what is requested.
                    format: int32
            description: |-
                PageRequest carries cursor-based paging. Offsets are never used — they skip and
                 repeat rows when data arrives mid-pagination, which this system does constantly.
        PageResponse:
            type: object
            properties:
                nextCursor:
                    type: string
                    description: Empty when there are no further pages.
                total:
                    type: string
                    description: |-
                        Approximate match count. Exact counts over hundreds of millions of rows cannot
                         meet the latency budget, so the API states when a count is an estimate rather
                         than implying precision it does not have.
                totalIsEstimate:
                    type: boolean
        PreviewAlertRuleRequest:
            type: object
            properties:
                ruleId:
                    type: string
                    description: Empty when previewing an unsaved rule.
                condition:
                    allOf:
                        - $ref: '#/components/schemas/RuleCondition'
                    description: |-
                        The condition to measure. Required, so an author can preview an edit before
                         saving it rather than only after.
                timeRange:
                    allOf:
                        - $ref: '#/components/schemas/TimeRange'
                    description: How far back to measure. Defaults to the condition's own window.
        PreviewAlertRuleResponse:
            type: object
            properties:
                groups:
                    type: array
                    items:
                        $ref: '#/components/schemas/PreviewGroup'
                wouldFireCount:
                    type: integer
                    format: uint32
        PreviewGroup:
            type: object
            properties:
                groupValues:
                    type: object
                    additionalProperties:
                        type: string
                observedValue:
                    type: number
                    format: double
                total:
                    type: number
                    format: double
                wouldFire:
                    type: boolean
                    description: |-
                        Whether this group WOULD have fired. Groups that would not fire are returned too:
                         an author tuning a threshold needs to see the values it did not trip on.
                evidenceCorrelationIds:
                    type: array
                    items:
                        type: string
            description: PreviewGroup is one group's measurement in a dry run.
        PurgeRequest:
            type: object
            properties:
                range:
                    $ref: '#/components/schemas/TimeRange'
                confirmation:
                    type: string
                    description: |-
                        Must equal the tenant name. A destructive operation should not be reachable by
                         an accidental click.
                reason:
                    type: string
        PurgeResponse:
            type: object
            properties:
                rowsDeleted:
                    type: string
        RefreshRequest:
            type: object
            properties:
                refreshToken:
                    type: string
        RejectedEvent:
            type: object
            properties:
                rejectedAt:
                    type: string
                    format: date-time
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                reasonCode:
                    type: string
                reasonDetail:
                    type: string
                payload:
                    type: string
                    description: |-
                        The offending payload, so an operator can see exactly what the vendor sent.
                         Rendered as inert text by the console.
                batchId:
                    type: string
        RequestInfo:
            type: object
            properties:
                host:
                    type: string
                path:
                    type: string
                query:
                    type: string
                method:
                    type: string
                status:
                    type: integer
                    format: uint32
            description: RequestInfo describes the HTTP request as normalized across vendors.
        ResolveAlertRequest:
            type: object
            properties:
                alertId:
                    type: string
                note:
                    type: string
        RuleCondition:
            type: object
            properties:
                filters:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Filters narrow which correlated requests the rule considers. Field names are
                         validated against the same allowlist a search uses.
                onlyDisagreements:
                    type: boolean
                minVendorCount:
                    type: integer
                    format: uint32
                aggregate:
                    enum:
                        - RULE_AGGREGATE_UNSPECIFIED
                        - RULE_AGGREGATE_COUNT
                        - RULE_AGGREGATE_RATE
                        - RULE_AGGREGATE_DISTINCT_IPS
                    type: string
                    format: enum
                comparator:
                    enum:
                        - RULE_COMPARATOR_UNSPECIFIED
                        - RULE_COMPARATOR_GT
                        - RULE_COMPARATOR_GTE
                        - RULE_COMPARATOR_LT
                        - RULE_COMPARATOR_LTE
                    type: string
                    format: enum
                threshold:
                    type: number
                    format: double
                windowSeconds:
                    type: integer
                    format: uint32
                groupBy:
                    type: array
                    items:
                        type: string
                    description: Each group is a separate alert and a separate cooldown, so this is capped.
                cooldownSeconds:
                    type: integer
                    description: |-
                        Must be at least as long as the window, or one sustained condition produces a
                         stream of duplicate alerts.
                    format: uint32
            description: |-
                RuleCondition is what a rule matches and measures.

                 A closed structure rather than an expression language: an operator writing a rule
                 must not be able to author something that scans without bounds or references a
                 column that does not exist.
        RuleCount:
            type: object
            properties:
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                ruleId:
                    type: string
                events:
                    type: string
        RulesPanel:
            type: object
            properties:
                rules:
                    type: array
                    items:
                        $ref: '#/components/schemas/RuleCount'
        SearchCorrelatedRequest:
            type: object
            properties:
                timeRange:
                    $ref: '#/components/schemas/TimeRange'
                filters:
                    $ref: '#/components/schemas/CorrelatedFilters'
                page:
                    $ref: '#/components/schemas/PageRequest'
        SearchCorrelatedResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/CorrelatedRequest'
                page:
                    $ref: '#/components/schemas/PageResponse'
        SearchEventsRequest:
            type: object
            properties:
                timeRange:
                    allOf:
                        - $ref: '#/components/schemas/TimeRange'
                    description: Required. An unbounded scan is rejected, not queued.
                filters:
                    $ref: '#/components/schemas/EventFilters'
                page:
                    $ref: '#/components/schemas/PageRequest'
        SearchEventsResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/EventSummary'
                page:
                    allOf:
                        - $ref: '#/components/schemas/PageResponse'
                    description: |-
                        Carries next_cursor, total, and total_is_estimate. Those live on PageResponse
                         rather than being repeated here: two places stating the same count is two places
                         to keep in step, and they will not stay in step.
        SourceCount:
            type: object
            properties:
                clientIp:
                    type: string
                country:
                    type: string
                asn:
                    type: integer
                    format: uint32
                events:
                    type: string
                blocked:
                    type: string
                    description: |-
                        A subset of events, never a separate tally: a source showing more blocks than
                         requests is nonsense an analyst cannot act on.
        SourcesPanel:
            type: object
            properties:
                sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/SourceCount'
        TenantSettings:
            type: object
            properties:
                tenantId:
                    type: string
                name:
                    type: string
                status:
                    type: string
                rawRetentionDays:
                    type: integer
                    format: uint32
                correlatedRetentionDays:
                    type: integer
                    format: uint32
                alertRetentionDays:
                    type: integer
                    format: uint32
                redactedFields:
                    type: array
                    items:
                        type: string
                    description: Fields masked at ingest, so they are never stored in readable form.
                scoreConflictThreshold:
                    type: number
                    format: float
                ingestFilters:
                    type: array
                    items:
                        $ref: '#/components/schemas/IngestFilterRule'
                    description: Events matching any of these are never ingested at all.
        TestFeedRequest:
            type: object
            properties:
                feedId:
                    type: string
        TestFeedResponse:
            type: object
            properties:
                reachable:
                    type: boolean
                credentialValid:
                    type: boolean
                detail:
                    type: string
                    description: Human-readable outcome. Never contains the credential or an internal address.
        TimeRange:
            type: object
            properties:
                from:
                    type: string
                    format: date-time
                to:
                    type: string
                    format: date-time
            description: |-
                TimeRange bounds a query. Both ends are REQUIRED on every event-data read:
                 unbounded scans are rejected, not queued (Constitution Principle V).
        TokenResponse:
            type: object
            properties:
                accessToken:
                    type: string
                refreshToken:
                    type: string
                expiresAt:
                    type: string
                    format: date-time
                user:
                    $ref: '#/components/schemas/UserProfile'
        UpdateAlertRuleRequest:
            type: object
            properties:
                ruleId:
                    type: string
                name:
                    type: string
                severity:
                    enum:
                        - SEVERITY_UNSPECIFIED
                        - SEVERITY_LOW
                        - SEVERITY_MEDIUM
                        - SEVERITY_HIGH
                        - SEVERITY_CRITICAL
                    type: string
                    format: enum
                condition:
                    $ref: '#/components/schemas/RuleCondition'
                webhookUrl:
                    type: string
                webhookSecret:
                    type: string
                enabled:
                    type: boolean
        UpdateCorrelationSettingsRequest:
            type: object
            properties:
                correlationWindowMs:
                    type: integer
                    format: uint32
                latenessBoundMs:
                    type: integer
                    format: uint32
                signalRanking:
                    type: array
                    items:
                        enum:
                            - JOIN_SIGNAL_UNSPECIFIED
                            - JOIN_SIGNAL_VENDOR_REQUEST_ID
                            - JOIN_SIGNAL_IP_HOST_PATH_METHOD
                            - JOIN_SIGNAL_TIME_WINDOW
                        type: string
                        format: enum
        UpdateFeedRequest:
            type: object
            properties:
                feedId:
                    type: string
                name:
                    type: string
                enabled:
                    type: boolean
                credential:
                    type: string
                    description: Rotates the credential. Omitted leaves the existing one in place.
                signingSecret:
                    type: string
                pullConfig:
                    type: string
                quotaEventsPerSec:
                    type: integer
                    format: uint32
                quotaBytesPerDay:
                    type: string
        UpdateTenantSettingsRequest:
            type: object
            properties:
                rawRetentionDays:
                    type: integer
                    format: uint32
                correlatedRetentionDays:
                    type: integer
                    format: uint32
                alertRetentionDays:
                    type: integer
                    format: uint32
                redactedFields:
                    type: array
                    items:
                        type: string
                scoreConflictThreshold:
                    type: number
                    format: float
                ingestFilters:
                    type: array
                    items:
                        $ref: '#/components/schemas/IngestFilterRule'
                    description: |-
                        Replaces the whole rule set rather than merging: a partial update has no obvious
                         meaning for a list, and "remove this one rule" must not require knowing which
                         position it occupies.
        UpdateUserRequest:
            type: object
            properties:
                userId:
                    type: string
                role:
                    type: string
                status:
                    type: string
                resetMfa:
                    type: boolean
                    description: Setting this resets MFA enrolment, forcing re-enrolment on next login.
        UserProfile:
            type: object
            properties:
                userId:
                    type: string
                email:
                    type: string
                role:
                    type: string
                    description: admin | analyst | auditor | ingest_only
                tenantId:
                    type: string
                tenantName:
                    type: string
                mfaEnabled:
                    type: boolean
                lastLoginAt:
                    type: string
                    format: date-time
        VendorVerdict:
            type: object
            properties:
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                verdict:
                    enum:
                        - VERDICT_UNSPECIFIED
                        - VERDICT_ALLOWED
                        - VERDICT_BLOCKED
                        - VERDICT_CHALLENGED
                        - VERDICT_RATE_LIMITED
                        - VERDICT_MONITORED
                        - VERDICT_UNKNOWN
                    type: string
                    format: enum
                verdictReason:
                    type: string
                ruleId:
                    type: string
                ruleIds:
                    type: array
                    items:
                        type: string
                score:
                    type: number
                    description: Absent when the vendor does not score requests.
                    format: float
                scoreKind:
                    type: string
                eventId:
                    type: string
                eventTime:
                    type: string
                    format: date-time
            description: VendorVerdict is one vendor's contribution to a correlated request.
        VerdictPoint:
            type: object
            properties:
                bucket:
                    type: string
                    format: date-time
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                verdict:
                    enum:
                        - VERDICT_UNSPECIFIED
                        - VERDICT_ALLOWED
                        - VERDICT_BLOCKED
                        - VERDICT_CHALLENGED
                        - VERDICT_RATE_LIMITED
                        - VERDICT_MONITORED
                        - VERDICT_UNKNOWN
                    type: string
                    format: enum
                events:
                    type: string
            description: VerdictPoint is one vendor's verdict count in one bucket.
        VerifyMFARequest:
            type: object
            properties:
                mfaChallengeToken:
                    type: string
                code:
                    type: string
        VolumePoint:
            type: object
            properties:
                bucket:
                    type: string
                    format: date-time
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                events:
                    type: string
            description: VolumePoint is one vendor's traffic in one bucket.
tags:
    - name: Admin
    - name: Alerts
    - name: Auth
    - name: Correlation
      description: |-
        Per-tenant correlation tuning lives on the Admin service alongside retention and
         redaction, not here: it is a privileged configuration change, and splitting the
         tenant's settings across two services would split their authorization with them.
    - name: Dashboards
    - name: Feeds
    - name: Search
