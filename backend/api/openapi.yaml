    /api/v1/waf-tuning/gaps:
        get:
            tags:
                - WafTuning
            description: |-
                Traffic the WAF scored as an attack that no rule matched — the mirror image of a
                 false positive, and a hole in the ruleset rather than noise in it.
            operationId: WafTuning_GetCoverageGaps
            parameters:
                - name: timeRange.from
                  in: query
                  schema:
                    type: string
                    format: date-time
                - name: timeRange.to
                  in: query
                  schema:
                    type: string
                    format: date-time
                - name: limit
                  in: query
                  description: Caps the rows returned. Clamped server-side.
                  schema:
                    type: integer
                    format: uint32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WafCoverageGapPanel'
    /api/v1/waf-tuning/rules:
        get:
            tags:
                - WafTuning
            description: 'The profile: every rule that fired, split by host, action and matching engine.'
            operationId: WafTuning_GetRuleProfile
            parameters:
                - name: timeRange.from
                  in: query
                  schema:
                    type: string
                    format: date-time
                - name: timeRange.to
                  in: query
                  schema:
                    type: string
                    format: date-time
                - name: limit
                  in: query
                  description: Caps the rows returned. Clamped server-side.
                  schema:
                    type: integer
                    format: uint32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WafRuleProfilePanel'
    /api/v1/waf-tuning/rules/{ruleId}/corroboration:
        get:
            tags:
                - WafTuning
            description: |-
                What the OTHER vendors did with the same requests. The strongest evidence a tuning
                 decision can have, and the one thing a single-vendor WAF console cannot show.
            operationId: WafTuning_GetCorroboration
            parameters:
                - name: ruleId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: timeRange.from
                  in: query
                  schema:
                    type: string
                    format: date-time
                - name: timeRange.to
                  in: query
                  schema:
                    type: string
                    format: date-time
                - name: limit
                  in: query
                  schema:
                    type: integer
                    format: uint32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WafCorroboration'
    /api/v1/waf-tuning/rules/{ruleId}/paths:
        get:
            tags:
                - WafTuning
            description: |-
                The URLs one rule matched on. Live over the events rather than a rollup, because
                 paths are effectively unbounded and this is only ever asked one rule at a time.
            operationId: WafTuning_GetRulePaths
            parameters:
                - name: ruleId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: timeRange.from
                  in: query
                  schema:
                    type: string
                    format: date-time
                - name: timeRange.to
                  in: query
                  schema:
                    type: string
                    format: date-time
                - name: limit
                  in: query
                  schema:
                    type: integer
                    format: uint32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WafRulePathsPanel'
components:
    schemas:
        AcknowledgeAlertRequest:
            type: object
            properties:
                alertId:
                    type: string
                note:
                    type: string
        Alert:
            type: object
            properties:
                alertId:
                    type: string
                ruleId:
                    type: string
                ruleName:
                    type: string
                firedAt:
                    type: string
                    format: date-time
                severity:
                    enum:
                        - SEVERITY_UNSPECIFIED
                        - SEVERITY_LOW
                        - SEVERITY_MEDIUM
                        - SEVERITY_HIGH
                        - SEVERITY_CRITICAL
                    type: string
                    format: enum
                state:
                    enum:
                        - ALERT_STATE_UNSPECIFIED
                        - ALERT_STATE_NEW
                        - ALERT_STATE_ACKNOWLEDGED
                        - ALERT_STATE_RESOLVED
                    type: string
                    format: enum
                groupValues:
                    type: object
                    additionalProperties:
                        type: string
                observedValue:
                    type: number
                    format: double
                threshold:
                    type: number
                    format: double
                evidenceCorrelationIds:
                    type: array
                    items:
                        type: string
                    description: |-
                        Links to the correlated records that caused the alert, so an operator opens the
                         evidence rather than reconstructing the query behind a number (SC-006).
                acknowledgedBy:
                    type: string
                acknowledgedAt:
                    type: string
                    format: date-time
                resolvedBy:
                    type: string
                resolvedAt:
                    type: string
                    format: date-time
                notifyStatus:
                    enum:
                        - NOTIFY_STATUS_UNSPECIFIED
                        - NOTIFY_STATUS_PENDING
                        - NOTIFY_STATUS_DELIVERED
                        - NOTIFY_STATUS_FAILED
                    type: string
                    format: enum
                notifyAttempts:
                    type: integer
                    format: uint32
                notifyLastError:
                    type: string
                    description: |-
                        The last delivery error, shown in the console so a failure is visible where the
                         alert is rather than only in a log an analyst cannot read.
        AlertRule:
            type: object
            properties:
                ruleId:
                    type: string
                name:
                    type: string
                enabled:
                    type: boolean
                severity:
                    enum:
                        - SEVERITY_UNSPECIFIED
                        - SEVERITY_LOW
                        - SEVERITY_MEDIUM
                        - SEVERITY_HIGH
                        - SEVERITY_CRITICAL
                    type: string
                    format: enum
                condition:
                    $ref: '#/components/schemas/RuleCondition'
                webhookUrl:
                    type: string
                webhookSigningConfigured:
                    type: boolean
                    description: True when a signing secret is configured. The secret itself is NEVER returned.
                createdBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        AsmFindings:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/AsmViolation'
                signatures:
                    type: array
                    items:
                        $ref: '#/components/schemas/AsmSignature'
                violationRating:
                    type: string
                    description: ASM's own 1-5 threat rating for the request, carried through as reported.
            description: |-
                AsmFindings explains a BIG-IP block in terms an analyst can act on.

                 A raw ASM record says "Illegal file type" and "200004165" and stops there. Deciding
                 whether that is an attack or a false positive otherwise means leaving the console for
                 the BIG-IP UI. These are the same tokens with their meanings attached.
        AsmSignature:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                    description: Empty for an id the catalogue does not carry, exactly as with a violation.
                accuracy:
                    type: string
                    description: |-
                        high | medium | low. Accuracy is the false-positive likelihood and risk is the
                         impact if real; an analyst triages on the pair, not on either alone.
                risk:
                    type: string
                attackType:
                    type: string
                description:
                    type: string
                cves:
                    type: array
                    items:
                        type: string
                    description: |-
                        Separated from references because a CVE is a pivot into every other tool the
                         analyst owns, while a blog post is context.
                references:
                    type: array
                    items:
                        type: string
                userDefined:
                    type: boolean
                    description: |-
                        True for a signature written by the customer rather than shipped by F5, which
                         changes who to ask about a false positive.
        AsmViolation:
            type: object
            properties:
                title:
                    type: string
                    description: The string ASM logged, and the key everything else here was resolved from.
                name:
                    type: string
                    description: |-
                        The VIOL_* constant. Empty when the catalogue does not carry this violation — a
                         newer policy, or a user-defined check — in which case only the title is populated
                         and the entry still appears, because the record says it fired.
                severity:
                    type: string
                attackType:
                    type: string
                description:
                    type: string
                risk:
                    type: string
                    description: |-
                        What an attacker gains if this is a true positive. The sentence that decides
                         whether the alert is worth chasing.
                examples:
                    type: string
        AsnCount:
            type: object
            properties:
                asn:
                    type: integer
                    format: uint32
                owner:
                    type: string
                    description: |-
                        The network's registered name, e.g. "VIVACOM-AS". Empty when the published table
                         does not list the number, in which case the console shows the bare ASN.
                country:
                    type: string
                    description: |-
                        The country most of this network's traffic came from. An ASN can span several, so
                         this names the majority rather than claiming the network sits in one place.
                events:
                    type: string
                blocked:
                    type: string
                    description: A subset of events, never a separate tally.
                clients:
                    type: string
                    description: |-
                        Distinct client addresses seen on this network. The number that separates one busy
                         client from a distributed source: 50,000 events from 3 addresses and from 30,000
                         addresses are different problems with different responses.
            description: |-
                AsnCount is one origin network's activity for the range.

                 The network behind the addresses, which is the level a lot of abuse is actually
                 organised at. A botnet spread over a hosting provider shows as a thousand
                 single-request addresses in the top-sources table and never reaches it; aggregated by
                 ASN the same traffic is one row near the top.
        AuditEntry:
            type: object
            properties:
                entryId:
                    type: string
                occurredAt:
                    type: string
                    format: date-time
                actorEmail:
                    type: string
                sourceIp:
                    type: string
                action:
                    type: string
                targetType:
                    type: string
                targetId:
                    type: string
                beforeValue:
                    type: string
                afterValue:
                    type: string
                result:
                    type: string
                detail:
                    type: string
                entryHash:
                    type: string
                    description: |-
                        The hash chain. Exposed so a reader can verify the LINKAGE themselves rather than
                         take the platform's word for it — an audit trail whose integrity can only be
                         confirmed by the system that wrote it is not evidence.

                         Checking these proves no entry was removed from the middle of a range: a deletion
                         breaks the chain where it happened. It does NOT prove the whole range was not
                         rewritten from the start; that needs the server-held anchor.
                previousHash:
                    type: string
        ClientInfo:
            type: object
            properties:
                ip:
                    type: string
                ipShared:
                    type: boolean
                    description: |-
                        True when the address looks like NAT, a proxy chain, or a carrier range. This
                         downgrades join confidence rather than silently weakening the match.
                asn:
                    type: integer
                    format: uint32
                country:
                    type: string
                userAgent:
                    type: string
                asnOwner:
                    type: string
                    description: |-
                        The network's registered name, e.g. "VIVACOM-AS" for AS8866. Resolved on read from
                         the public iptoasn table rather than stored on the event: ownership is a fact about
                         the internet that changes independently of the traffic, and copying it onto a
                         hundred million rows would freeze whatever it said the day they were written.

                         EMPTY when the number is unknown to the table, which is not an error — the console
                         shows the bare ASN, as it did before names existed.
            description: ClientInfo describes the requesting client as normalized across vendors.
        CorrelatedFilters:
            type: object
            properties:
                clientIp:
                    type: string
                requestHost:
                    type: string
                requestPath:
                    type: string
                country:
                    type: string
                asn:
                    type: integer
                    format: uint32
                minVendorCount:
                    type: integer
                    description: Above 1 restricts the result to genuine cross-vendor joins.
                    format: uint32
                onlyDisagreements:
                    type: boolean
                disagreementKind:
                    enum:
                        - DISAGREEMENT_KIND_UNSPECIFIED
                        - DISAGREEMENT_KIND_NONE
                        - DISAGREEMENT_KIND_ALLOW_VS_BLOCK
                        - DISAGREEMENT_KIND_ALLOW_VS_CHALLENGE
                        - DISAGREEMENT_KIND_SCORE_CONFLICT
                    type: string
                    format: enum
                confidence:
                    enum:
                        - CONFIDENCE_UNSPECIFIED
                        - CONFIDENCE_HIGH
                        - CONFIDENCE_MEDIUM
                        - CONFIDENCE_LOW
                    type: string
                    format: enum
                combinedOutcome:
                    enum:
                        - VERDICT_UNSPECIFIED
                        - VERDICT_ALLOWED
                        - VERDICT_BLOCKED
                        - VERDICT_CHALLENGED
                        - VERDICT_RATE_LIMITED
                        - VERDICT_MONITORED
                        - VERDICT_UNKNOWN
                    type: string
                    format: enum
                vendorRequestId:
                    type: string
                    description: |-
                        The identifier SHARED between vendors — Cloudflare's ray. Resolved to the events
                         carrying it, then matched against the record's event list.
                vendorEventId:
                    type: string
                    description: The vendor's OWN reference for its record. F5's support_id.
                ja4:
                    type: string
                    description: |-
                        TLS client fingerprint. Like the identifiers above it, this is resolved to the
                         events carrying it and then matched against the record's event list — a correlated
                         request has no fingerprint of its own, because the vendors that joined into it need
                         not all have reported one.
            description: CorrelatedFilters add the join-level facets to the event filters.
        CorrelatedRequest:
            type: object
            properties:
                correlationId:
                    type: string
                windowStart:
                    type: string
                    format: date-time
                firstEventTime:
                    type: string
                    format: date-time
                lastEventTime:
                    type: string
                    format: date-time
                client:
                    $ref: '#/components/schemas/ClientInfo'
                request:
                    $ref: '#/components/schemas/RequestInfo'
                vendorVerdicts:
                    type: array
                    items:
                        $ref: '#/components/schemas/VendorVerdict'
                    description: |-
                        One entry per contributing vendor, so a disagreement can be read directly off
                         the record rather than inferred from a flattened summary.
                vendorCount:
                    type: integer
                    description: '1 is normal, not an error: plenty of hostnames sit behind a single vendor (FR-016).'
                    format: uint32
                eventIds:
                    type: array
                    items:
                        type: string
                    description: Ids of the contributing events, for drilling through to the raw payloads (FR-024).
                combinedOutcome:
                    enum:
                        - VERDICT_UNSPECIFIED
                        - VERDICT_ALLOWED
                        - VERDICT_BLOCKED
                        - VERDICT_CHALLENGED
                        - VERDICT_RATE_LIMITED
                        - VERDICT_MONITORED
                        - VERDICT_UNKNOWN
                    type: string
                    description: The most restrictive verdict any vendor reached.
                    format: enum
                hasDisagreement:
                    type: boolean
                disagreementKind:
                    enum:
                        - DISAGREEMENT_KIND_UNSPECIFIED
                        - DISAGREEMENT_KIND_NONE
                        - DISAGREEMENT_KIND_ALLOW_VS_BLOCK
                        - DISAGREEMENT_KIND_ALLOW_VS_CHALLENGE
                        - DISAGREEMENT_KIND_SCORE_CONFLICT
                    type: string
                    format: enum
                joinSignals:
                    type: array
                    items:
                        enum:
                            - JOIN_SIGNAL_UNSPECIFIED
                            - JOIN_SIGNAL_VENDOR_REQUEST_ID
                            - JOIN_SIGNAL_IP_HOST_PATH_METHOD
                            - JOIN_SIGNAL_TIME_WINDOW
                        type: string
                        format: enum
                joinTier:
                    type: integer
                    description: 1 = exact shared request id, 2 = heuristic match.
                    format: uint32
                confidence:
                    enum:
                        - CONFIDENCE_UNSPECIFIED
                        - CONFIDENCE_HIGH
                        - CONFIDENCE_MEDIUM
                        - CONFIDENCE_LOW
                    type: string
                    format: enum
                candidateCount:
                    type: integer
                    description: Above 1, several events competed for the join and the chosen one may be wrong.
                    format: uint32
                version:
                    type: string
                    description: |-
                        Increments each time a late arrival amends the record. The correlation_id never
                         changes, so a bookmarked record stays findable.
                amended:
                    type: boolean
            description: CorrelatedRequest is one request as every vendor that saw it reported it.
        CorrelationSettings:
            type: object
            properties:
                correlationWindowMs:
                    type: integer
                    description: How far apart two events may be and still describe the same request.
                    format: uint32
                latenessBoundMs:
                    type: integer
                    description: How late an event may arrive and still amend an existing correlated record.
                    format: uint32
                signalRanking:
                    type: array
                    items:
                        enum:
                            - JOIN_SIGNAL_UNSPECIFIED
                            - JOIN_SIGNAL_VENDOR_REQUEST_ID
                            - JOIN_SIGNAL_IP_HOST_PATH_METHOD
                            - JOIN_SIGNAL_TIME_WINDOW
                        type: string
                        format: enum
                    description: Ranked join signals, most trusted first.
        CreateAlertRuleRequest:
            type: object
            properties:
                name:
                    type: string
                severity:
                    enum:
                        - SEVERITY_UNSPECIFIED
                        - SEVERITY_LOW
                        - SEVERITY_MEDIUM
                        - SEVERITY_HIGH
                        - SEVERITY_CRITICAL
                    type: string
                    format: enum
                condition:
                    $ref: '#/components/schemas/RuleCondition'
                webhookUrl:
                    type: string
                webhookSecret:
                    type: string
                    description: Accepted here, stored in the secret manager, and never echoed back.
                enabled:
                    type: boolean
        CreateFeedRequest:
            type: object
            properties:
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                name:
                    type: string
                deliveryMode:
                    enum:
                        - DELIVERY_MODE_UNSPECIFIED
                        - DELIVERY_MODE_PUSH
                        - DELIVERY_MODE_PULL
                    type: string
                    format: enum
                credential:
                    type: string
                    description: Write-only. Supplied once, stored in the secret manager, never read back.
                signingSecret:
                    type: string
                    description: Optional HMAC key for vendors that sign their deliveries.
                pullConfig:
                    type: string
                quotaEventsPerSec:
                    type: integer
                    format: uint32
                quotaBytesPerDay:
                    type: string
        CreateUserRequest:
            type: object
            properties:
                email:
                    type: string
                password:
                    type: string
                    description: |-
                        Optional. Leaving it empty is the normal path: the account is created in the
                         `invited` state and reaches a usable password through IssueUserInvite, so the
                         platform can always tell the admin and the user apart in its own audit trail.
                role:
                    type: string
        DeleteAlertRuleResponse:
            type: object
            properties:
                disabled:
                    type: boolean
        DeleteFeedResponse:
            type: object
            properties: {}
        DeleteUserResponse:
            type: object
            properties: {}
        DisagreementPoint:
            type: object
            properties:
                bucket:
                    type: string
                    format: date-time
                kind:
                    enum:
                        - DISAGREEMENT_KIND_UNSPECIFIED
                        - DISAGREEMENT_KIND_NONE
                        - DISAGREEMENT_KIND_ALLOW_VS_BLOCK
                        - DISAGREEMENT_KIND_ALLOW_VS_CHALLENGE
                        - DISAGREEMENT_KIND_SCORE_CONFLICT
                    type: string
                    format: enum
                records:
                    type: string
                total:
                    type: string
                    description: |-
                        Every correlated request in the bucket. Carried alongside the numerator so a rate
                         can be computed from one row rather than by dividing figures fetched separately,
                         which is how two panels on one screen end up disagreeing.
        DisagreementsPanel:
            type: object
            properties:
                points:
                    type: array
                    items:
                        $ref: '#/components/schemas/DisagreementPoint'
                totalRecords:
                    type: string
                totalDisagreements:
                    type: string
        EraseUserResponse:
            type: object
            properties: {}
        EventDetail:
            type: object
            properties:
                summary:
                    $ref: '#/components/schemas/EventSummary'
                rawPayload:
                    type: string
                    description: |-
                        The vendor payload exactly as received, written before any parsing was attempted
                         so a parse failure can never cost the original (FR-005).
                rawContentType:
                    type: string
                rawExtra:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Vendor-native fields with no common-model home (FR-012).

                         Reconstructed from raw_payload on read rather than stored: it is a parsed view of
                         those same bytes, and keeping both cost 12.79 GiB to say twice what the payload
                         already said once. The tenant's redaction policy is re-applied when it is rebuilt,
                         so a masked field is masked here exactly as it was when stored.
                correlationId:
                    type: string
                    description: Set when this event was correlated with others, for drill-through.
                unknownFields:
                    type: array
                    items:
                        type: string
                    description: |-
                        Vendor fields the adapter did not recognise, for the event being inspected.
                         Reconstructed alongside raw_extra from the same parse.
                asm:
                    allOf:
                        - $ref: '#/components/schemas/AsmFindings'
                    description: |-
                        What BIG-IP ASM actually objected to, resolved against the embedded catalogue.

                         Set only for F5 events that carry violations or signatures — which in practice
                         means blocked and monitored ones. Absent rather than empty for every other vendor,
                         so a client can branch on presence instead of on vendor.
            description: EventDetail is one event with everything the platform holds about it.
        EventFilters:
            type: object
            properties:
                clientIp:
                    type: string
                requestHost:
                    type: string
                requestPath:
                    type: string
                vendor:
                    type: array
                    items:
                        enum:
                            - VENDOR_UNSPECIFIED
                            - VENDOR_CLOUDFLARE
                            - VENDOR_F5
                            - VENDOR_DATADOME
                            - VENDOR_NGINX
                        type: string
                        format: enum
                verdict:
                    type: array
                    items:
                        enum:
                            - VERDICT_UNSPECIFIED
                            - VERDICT_ALLOWED
                            - VERDICT_BLOCKED
                            - VERDICT_CHALLENGED
                            - VERDICT_RATE_LIMITED
                            - VERDICT_MONITORED
                            - VERDICT_UNKNOWN
                        type: string
                        format: enum
                ruleId:
                    type: string
                minScore:
                    type: number
                    format: float
                maxScore:
                    type: number
                    format: float
                country:
                    type: string
                asn:
                    type: integer
                    format: uint32
                userAgent:
                    type: string
                q:
                    type: string
                    description: |-
                        Free-text match across the request path and user agent, backed by the token bloom
                         indexes. Not a general full-text search: a substring scan over every column could
                         not meet the latency budget and would quietly become the slowest query in the app.
                vendorRequestId:
                    type: string
                requestMethod:
                    type: string
                httpStatus:
                    type: integer
                    format: uint32
                vendorEventId:
                    type: string
                    description: |-
                        The vendor's OWN reference for its record, as opposed to vendor_request_id which
                         is the identifier shared between vendors. F5's support_id.
                ja4:
                    type: string
                    description: |-
                        TLS client fingerprint. An exact match, never a substring: the value is one opaque
                         token and a partial fingerprint identifies nothing.

                         Only matches events ingested after the fingerprint became a stored column — see
                         migration 0014. Older events carry no value and cannot be found by it.
                minWafAttackScore:
                    type: integer
                    description: |-
                        WAF attack score bounds, on Cloudflare's INVERTED scale: 1 is certainly an attack,
                         100 certainly clean, 0 not scored. `max_waf_attack_score = 20` is therefore "show me
                         what the WAF believes is an attack" — the filter ruleset tuning is built on.

                         1-100 and not the documented 1-99: Cloudflare emits 100 for a definitively clean
                         request, and it is the most common value in real traffic.
                    format: uint32
                maxWafAttackScore:
                    type: integer
                    format: uint32
                wafAction:
                    type: string
                    description: |-
                        The vendor's own action verb, as opposed to the verdict it collapses into:
                         log | skip | block | managedChallenge | allow | bypass.
                wafSource:
                    type: string
                    description: 'The engine that matched: firewallManaged | firewallCustom | ip | bic.'
            description: |-
                EventFilters are the cross-vendor filters an analyst can apply.

                 Every field here is optional and every one is validated against an allowlist before
                 it reaches SQL. Unset fields are omitted from the query rather than matched against
                 an empty string, so a blank filter widens nothing.
        EventSummary:
            type: object
            properties:
                eventId:
                    type: string
                eventTime:
                    type: string
                    format: date-time
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                feedId:
                    type: string
                vendorRequestId:
                    type: string
                vendorEventId:
                    type: string
                client:
                    $ref: '#/components/schemas/ClientInfo'
                request:
                    $ref: '#/components/schemas/RequestInfo'
                verdict:
                    enum:
                        - VERDICT_UNSPECIFIED
                        - VERDICT_ALLOWED
                        - VERDICT_BLOCKED
                        - VERDICT_CHALLENGED
                        - VERDICT_RATE_LIMITED
                        - VERDICT_MONITORED
                        - VERDICT_UNKNOWN
                    type: string
                    format: enum
                verdictReason:
                    type: string
                ruleId:
                    type: string
                ruleDescription:
                    type: string
                    description: |-
                        What the rule is CALLED. Cloudflare's Logpush reports the rule that matched as an
                         opaque id and nothing else, so this is resolved on read from the tenant's own rule
                         table -- see the cfrules package. Empty when the id cannot be named: the rule may
                         have been deleted since the event was logged, the token may not cover its zone, or
                         no token may be configured at all.

                         NOT STORED on the event. A rule's name is the customer's configuration and changes
                         independently of the traffic, so copying it onto a hundred million rows would freeze
                         whatever it said the day they were written.
                ruleIds:
                    type: array
                    items:
                        type: string
                score:
                    type: number
                    format: float
                scoreKind:
                    type: string
                ja4:
                    type: string
                    description: TLS client fingerprint, so a result row can be pivoted on without opening it.
                waf:
                    allOf:
                        - $ref: '#/components/schemas/WafDetail'
                    description: |-
                        The WAF's own view of the request, shown so a result row carries the evidence
                         rather than only the outcome.
            description: |-
                EventSummary is one search hit.

                 Deliberately narrower than the detail view: the raw vendor payload is excluded, so a
                 thousand-row page stays kilobytes rather than tens of megabytes. GetEvent fetches
                 the payload for the one row an analyst opens.
        ExportSearchRequest:
            type: object
            properties:
                timeRange:
                    $ref: '#/components/schemas/TimeRange'
                filters:
                    $ref: '#/components/schemas/EventFilters'
                format:
                    enum:
                        - EXPORT_FORMAT_UNSPECIFIED
                        - EXPORT_FORMAT_NDJSON
                        - EXPORT_FORMAT_CSV
                    type: string
                    format: enum
                maxRows:
                    type: integer
                    description: Capped server-side regardless of what is requested.
                    format: uint32
        ExportSearchResponse:
            type: object
            properties:
                content:
                    type: string
                    description: The export content, streamed to the caller.
                    format: bytes
                contentType:
                    type: string
                filename:
                    type: string
                rowCount:
                    type: string
                    description: |-
                        Signed, matching PageResponse.total: row counts are one concept and should not
                         change type depending on which message carries them.
                truncated:
                    type: boolean
                    description: |-
                        True when the export stopped at the row cap, so the caller knows the file is a
                         prefix of the result rather than all of it.
        Feed:
            type: object
            properties:
                feedId:
                    type: string
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                name:
                    type: string
                deliveryMode:
                    enum:
                        - DELIVERY_MODE_UNSPECIFIED
                        - DELIVERY_MODE_PUSH
                        - DELIVERY_MODE_PULL
                    type: string
                    format: enum
                enabled:
                    type: boolean
                credentialConfigured:
                    type: boolean
                    description: True when a credential is configured. The credential itself is NEVER returned.
                signingConfigured:
                    type: boolean
                pullConfig:
                    type: string
                quotaEventsPerSec:
                    type: integer
                    format: uint32
                quotaBytesPerDay:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                health:
                    allOf:
                        - $ref: '#/components/schemas/FeedHealth'
                    description: Populated on list and get so the console can show status without a second call.
        FeedHealth:
            type: object
            properties:
                feedId:
                    type: string
                lastEventAt:
                    type: string
                    format: date-time
                silent:
                    type: boolean
                    description: True when nothing has arrived for longer than the expected interval.
                eventsPerSec:
                    type: number
                    format: double
                eventsReceived1h:
                    type: string
                eventsRejected1h:
                    type: string
                duplicatesSuppressed1h:
                    type: string
                bytesReceived1h:
                    type: string
                maxIngestLagMs:
                    type: integer
                    format: uint32
                credentialValid:
                    type: boolean
                schemaDriftWarning:
                    type: boolean
                    description: Set when unrecognized vendor fields crossed the drift threshold (FR-012).
                driftFields:
                    type: array
                    items:
                        type: string
            description: |-
                FeedHealth answers "is this feed working" (FR-008).

                 Silence detection lives here because a feed that stopped sending looks exactly like
                 clean traffic on a dashboard. `silent` is what distinguishes them.
        FeedHealthPanel:
            type: object
            properties:
                feeds:
                    type: array
                    items:
                        $ref: '#/components/schemas/FeedHealth'
        IngestFilterRule:
            type: object
            properties:
                field:
                    type: string
                    description: 'One of: request_host, request_path.'
                op:
                    type: string
                    description: |-
                        One of: equals, suffix, prefix, contains. Matching ignores case, because hostnames
                         are case-insensitive and extensions arrive in both cases from real traffic.
                values:
                    type: array
                    items:
                        type: string
                    description: Any value matching drops the event, as does any rule — the whole set is an OR.
            description: |-
                IngestFilterRule excludes matching events from ingestion entirely.

                 A matched event is stored NOWHERE — no raw payload, no normalized row, no rejection —
                 so the only trace it leaves is the filtered counter on feed health. That is why the
                 vocabulary is closed and literal rather than a regular expression: a rule an operator
                 can misread is a rule that silently deletes the traffic they needed, and unlike every
                 other loss in this system there is no copy to recover from.
        IssueUserInviteRequest:
            type: object
            properties:
                userId:
                    type: string
        ListAlertRulesResponse:
            type: object
            properties:
                rules:
                    type: array
                    items:
                        $ref: '#/components/schemas/AlertRule'
        ListAlertsResponse:
            type: object
            properties:
                alerts:
                    type: array
                    items:
                        $ref: '#/components/schemas/Alert'
                page:
                    $ref: '#/components/schemas/PageResponse'
        ListAuditEntriesResponse:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/AuditEntry'
                page:
                    $ref: '#/components/schemas/PageResponse'
                chainIntact:
                    type: boolean
                    description: |-
                        False when the hash chain over the returned range does not verify, meaning an
                         entry was altered or removed.
        ListCorrelatedRequestsResponse:
            type: object
            properties:
                requests:
                    type: array
                    items:
                        $ref: '#/components/schemas/CorrelatedRequest'
                page:
                    $ref: '#/components/schemas/PageResponse'
        ListFeedsResponse:
            type: object
            properties:
                feeds:
                    type: array
                    items:
                        $ref: '#/components/schemas/Feed'
        ListRejectedEventsResponse:
            type: object
            properties:
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/RejectedEvent'
                page:
                    $ref: '#/components/schemas/PageResponse'
        ListUsersResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/UserProfile'
                page:
                    $ref: '#/components/schemas/PageResponse'
        LoginRequest:
            type: object
            properties:
                email:
                    type: string
                password:
                    type: string
        LoginResponse:
            type: object
            properties:
                mfaChallengeToken:
                    type: string
                    description: Short-lived token proving the password step succeeded. Grants nothing else.
                mfaEnrolmentRequired:
                    type: boolean
                    description: True on first login, when the client must render the enrolment QR code.
                mfaProvisioningUri:
                    type: string
                    description: Populated only during enrolment, and never again afterwards.
        LogoutRequest:
            type: object
            properties:
                refreshToken:
                    type: string
        LogoutResponse:
            type: object
            properties: {}
        MeResponse:
            type: object
            properties:
                user:
                    $ref: '#/components/schemas/UserProfile'
        OverviewPanel:
            type: object
            properties:
                volume:
                    type: array
                    items:
                        $ref: '#/components/schemas/VolumePoint'
                verdicts:
                    type: array
                    items:
                        $ref: '#/components/schemas/VerdictPoint'
                totalEvents:
                    type: string
                    description: |-
                        Totals for the whole range, so a headline figure does not require the client to
                         re-sum the series and risk disagreeing with it.
                totalBlocked:
                    type: string
                totalChallenged:
                    type: string
        PageRequest:
            type: object
            properties:
                cursor:
                    type: string
                    description: Opaque cursor from a previous PageResponse. Empty requests the first page.
                limit:
                    type: integer
                    description: Server caps this at QUERY_MAX_RESULT_ROWS regardless of what is requested.
                    format: int32
            description: |-
                PageRequest carries cursor-based paging. Offsets are never used — they skip and
                 repeat rows when data arrives mid-pagination, which this system does constantly.
        PageResponse:
            type: object
            properties:
                nextCursor:
                    type: string
                    description: Empty when there are no further pages.
                total:
                    type: string
                    description: |-
                        Approximate match count. Exact counts over hundreds of millions of rows cannot
                         meet the latency budget, so the API states when a count is an estimate rather
                         than implying precision it does not have.
                totalIsEstimate:
                    type: boolean
        PreviewAlertRuleRequest:
            type: object
            properties:
                ruleId:
                    type: string
                    description: Empty when previewing an unsaved rule.
                condition:
                    allOf:
                        - $ref: '#/components/schemas/RuleCondition'
                    description: |-
                        The condition to measure. Required, so an author can preview an edit before
                         saving it rather than only after.
                timeRange:
                    allOf:
                        - $ref: '#/components/schemas/TimeRange'
                    description: How far back to measure. Defaults to the condition's own window.
        PreviewAlertRuleResponse:
            type: object
            properties:
                groups:
                    type: array
                    items:
                        $ref: '#/components/schemas/PreviewGroup'
                wouldFireCount:
                    type: integer
                    format: uint32
        PreviewGroup:
            type: object
            properties:
                groupValues:
                    type: object
                    additionalProperties:
                        type: string
                observedValue:
                    type: number
                    format: double
                total:
                    type: number
                    format: double
                wouldFire:
                    type: boolean
                    description: |-
                        Whether this group WOULD have fired. Groups that would not fire are returned too:
                         an author tuning a threshold needs to see the values it did not trip on.
                evidenceCorrelationIds:
                    type: array
                    items:
                        type: string
            description: PreviewGroup is one group's measurement in a dry run.
        PreviewInviteRequest:
            type: object
            properties:
                setupToken:
                    type: string
        PreviewInviteResponse:
            type: object
            properties:
                email:
                    type: string
                expiresAt:
                    type: string
                    format: date-time
        PurgeRequest:
            type: object
            properties:
                range:
                    $ref: '#/components/schemas/TimeRange'
                confirmation:
                    type: string
                    description: |-
                        Must equal the tenant name. A destructive operation should not be reachable by
                         an accidental click.
                reason:
                    type: string
        PurgeResponse:
            type: object
            properties:
                rowsDeleted:
                    type: string
        RedeemInviteRequest:
            type: object
            properties:
                setupToken:
                    type: string
                password:
                    type: string
        RedeemInviteResponse:
            type: object
            properties:
                email:
                    type: string
                    description: Echoed so the sign-in form that follows can be prefilled.
        RefreshRequest:
            type: object
            properties:
                refreshToken:
                    type: string
        RejectedEvent:
            type: object
            properties:
                rejectedAt:
                    type: string
                    format: date-time
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                reasonCode:
                    type: string
                reasonDetail:
                    type: string
                payload:
                    type: string
                    description: |-
                        The offending payload, so an operator can see exactly what the vendor sent.
                         Rendered as inert text by the console.
                batchId:
                    type: string
        RequestInfo:
            type: object
            properties:
                host:
                    type: string
                path:
                    type: string
                query:
                    type: string
                method:
                    type: string
                status:
                    type: integer
                    format: uint32
            description: RequestInfo describes the HTTP request as normalized across vendors.
        ResolveAlertRequest:
            type: object
            properties:
                alertId:
                    type: string
                note:
                    type: string
        RuleCondition:
            type: object
            properties:
                filters:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Filters narrow which correlated requests the rule considers. Field names are
                         validated against the same allowlist a search uses.
                onlyDisagreements:
                    type: boolean
                minVendorCount:
                    type: integer
                    format: uint32
                aggregate:
                    enum:
                        - RULE_AGGREGATE_UNSPECIFIED
                        - RULE_AGGREGATE_COUNT
                        - RULE_AGGREGATE_RATE
                        - RULE_AGGREGATE_DISTINCT_IPS
                    type: string
                    format: enum
                comparator:
                    enum:
                        - RULE_COMPARATOR_UNSPECIFIED
                        - RULE_COMPARATOR_GT
                        - RULE_COMPARATOR_GTE
                        - RULE_COMPARATOR_LT
                        - RULE_COMPARATOR_LTE
                    type: string
                    format: enum
                threshold:
                    type: number
                    format: double
                windowSeconds:
                    type: integer
                    format: uint32
                groupBy:
                    type: array
                    items:
                        type: string
                    description: Each group is a separate alert and a separate cooldown, so this is capped.
                cooldownSeconds:
                    type: integer
                    description: |-
                        Must be at least as long as the window, or one sustained condition produces a
                         stream of duplicate alerts.
                    format: uint32
            description: |-
                RuleCondition is what a rule matches and measures.

                 A closed structure rather than an expression language: an operator writing a rule
                 must not be able to author something that scans without bounds or references a
                 column that does not exist.
        RuleCount:
            type: object
            properties:
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                ruleId:
                    type: string
                events:
                    type: string
                ruleDescription:
                    type: string
                    description: |-
                        The rule's name, resolved on read. The panel this feeds is a ranking of opaque ids
                         without it, which is the least useful form of a top-ten list.
        RulesPanel:
            type: object
            properties:
                rules:
                    type: array
                    items:
                        $ref: '#/components/schemas/RuleCount'
        SearchCorrelatedRequest:
            type: object
            properties:
                timeRange:
                    $ref: '#/components/schemas/TimeRange'
                filters:
                    $ref: '#/components/schemas/CorrelatedFilters'
                page:
                    $ref: '#/components/schemas/PageRequest'
        SearchCorrelatedResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/CorrelatedRequest'
                page:
                    $ref: '#/components/schemas/PageResponse'
        SearchEventsRequest:
            type: object
            properties:
                timeRange:
                    allOf:
                        - $ref: '#/components/schemas/TimeRange'
                    description: Required. An unbounded scan is rejected, not queued.
                filters:
                    $ref: '#/components/schemas/EventFilters'
                page:
                    $ref: '#/components/schemas/PageRequest'
        SearchEventsResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/EventSummary'
                page:
                    allOf:
                        - $ref: '#/components/schemas/PageResponse'
                    description: |-
                        Carries next_cursor, total, and total_is_estimate. Those live on PageResponse
                         rather than being repeated here: two places stating the same count is two places
                         to keep in step, and they will not stay in step.
        SourceCount:
            type: object
            properties:
                clientIp:
                    type: string
                country:
                    type: string
                asn:
                    type: integer
                    format: uint32
                asnOwner:
                    type: string
                    description: |-
                        The network's registered name. See ClientInfo.asn_owner for why it is resolved on
                         read rather than stored.
                events:
                    type: string
                blocked:
                    type: string
                    description: |-
                        A subset of events, never a separate tally: a source showing more blocks than
                         requests is nonsense an analyst cannot act on.
        SourcesPanel:
            type: object
            properties:
                sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/SourceCount'
                asns:
                    type: array
                    items:
                        $ref: '#/components/schemas/AsnCount'
                    description: |-
                        The same traffic aggregated by origin network. Carried on this panel rather than
                         its own so one request serves both views and they cannot disagree about the range.
        StoragePanel:
            type: object
            properties:
                diskTotalBytes:
                    type: string
                    description: The filesystem ClickHouse writes to.
                diskFreeBytes:
                    type: string
                databaseBytes:
                    type: string
                    description: |-
                        What this platform's own database occupies, which is NOT total minus free: the disk
                         may hold anything else the host puts there, and reporting the difference as ours
                         would blame the platform for someone else's files.
                bytesPerDay:
                    type: string
                    description: Average bytes written per day, measured over whole days only.
                measuredDays:
                    type: integer
                    description: |-
                        How many whole days that average is based on. A projection from one day is a guess
                         and the console has to be able to say so.
                    format: uint32
                daysRemaining:
                    type: number
                    description: |-
                        Days until the disk is full at the measured rate. Zero when growth is zero or
                         negative -- which is the expected steady state once retention starts expiring as
                         much as ingestion writes, not an error.
                    format: double
                steady:
                    type: boolean
                    description: True once expiry offsets ingestion, meaning days_remaining is not meaningful.
                tables:
                    type: array
                    items:
                        $ref: '#/components/schemas/TableSize'
            description: StoragePanel answers "how long until we run out of disk".
        TableSize:
            type: object
            properties:
                table:
                    type: string
                bytes:
                    type: string
                rows:
                    type: string
            description: TableSize is how much disk one table occupies.
        TenantSettings:
            type: object
            properties:
                tenantId:
                    type: string
                name:
                    type: string
                status:
                    type: string
                rawRetentionDays:
                    type: integer
                    format: uint32
                correlatedRetentionDays:
                    type: integer
                    format: uint32
                alertRetentionDays:
                    type: integer
                    format: uint32
                redactedFields:
                    type: array
                    items:
                        type: string
                    description: Fields masked at ingest, so they are never stored in readable form.
                scoreConflictThreshold:
                    type: number
                    format: float
                ingestFilters:
                    type: array
                    items:
                        $ref: '#/components/schemas/IngestFilterRule'
                    description: Events matching any of these are never ingested at all.
                cloudflareTokenConfigured:
                    type: boolean
                    description: |-
                        Whether a Cloudflare API token is configured, so the console can say whether rule
                         names will resolve. The TOKEN ITSELF IS NEVER RETURNED -- not masked, not truncated,
                         not once: it is write-only by design, and a settings endpoint that echoes a
                         credential turns every screenshot and browser cache into a leak.
        TestFeedRequest:
            type: object
            properties:
                feedId:
                    type: string
        TestFeedResponse:
            type: object
            properties:
                reachable:
                    type: boolean
                credentialValid:
                    type: boolean
                detail:
                    type: string
                    description: Human-readable outcome. Never contains the credential or an internal address.
        TimeRange:
            type: object
            properties:
                from:
                    type: string
                    format: date-time
                to:
                    type: string
                    format: date-time
            description: |-
                TimeRange bounds a query. Both ends are REQUIRED on every event-data read:
                 unbounded scans are rejected, not queued (Constitution Principle V).
        TokenResponse:
            type: object
            properties:
                accessToken:
                    type: string
                refreshToken:
                    type: string
                expiresAt:
                    type: string
                    format: date-time
                user:
                    $ref: '#/components/schemas/UserProfile'
        UpdateAlertRuleRequest:
            type: object
            properties:
                ruleId:
                    type: string
                name:
                    type: string
                severity:
                    enum:
                        - SEVERITY_UNSPECIFIED
                        - SEVERITY_LOW
                        - SEVERITY_MEDIUM
                        - SEVERITY_HIGH
                        - SEVERITY_CRITICAL
                    type: string
                    format: enum
                condition:
                    $ref: '#/components/schemas/RuleCondition'
                webhookUrl:
                    type: string
                webhookSecret:
                    type: string
                enabled:
                    type: boolean
        UpdateCorrelationSettingsRequest:
            type: object
            properties:
                correlationWindowMs:
                    type: integer
                    format: uint32
                latenessBoundMs:
                    type: integer
                    format: uint32
                signalRanking:
                    type: array
                    items:
                        enum:
                            - JOIN_SIGNAL_UNSPECIFIED
                            - JOIN_SIGNAL_VENDOR_REQUEST_ID
                            - JOIN_SIGNAL_IP_HOST_PATH_METHOD
                            - JOIN_SIGNAL_TIME_WINDOW
                        type: string
                        format: enum
        UpdateFeedRequest:
            type: object
            properties:
                feedId:
                    type: string
                name:
                    type: string
                enabled:
                    type: boolean
                credential:
                    type: string
                    description: Rotates the credential. Omitted leaves the existing one in place.
                signingSecret:
                    type: string
                pullConfig:
                    type: string
                quotaEventsPerSec:
                    type: integer
                    format: uint32
                quotaBytesPerDay:
                    type: string
        UpdateTenantSettingsRequest:
            type: object
            properties:
                rawRetentionDays:
                    type: integer
                    format: uint32
                correlatedRetentionDays:
                    type: integer
                    format: uint32
                alertRetentionDays:
                    type: integer
                    format: uint32
                redactedFields:
                    type: array
                    items:
                        type: string
                scoreConflictThreshold:
                    type: number
                    format: float
                ingestFilters:
                    type: array
                    items:
                        $ref: '#/components/schemas/IngestFilterRule'
                    description: |-
                        Replaces the whole rule set rather than merging: a partial update has no obvious
                         meaning for a list, and "remove this one rule" must not require knowing which
                         position it occupies.
                cloudflareApiToken:
                    type: string
                    description: |-
                        The Cloudflare API token used to read WAF rule names, needing Zone WAF Read. Sent
                         once and stored by reference in the secret store, never in the database.

                         Absent leaves the current token alone -- so an operator changing retention does not
                         have to re-enter it. An EMPTY STRING clears it, which is how a token is revoked.
        UpdateUserRequest:
            type: object
            properties:
                userId:
                    type: string
                role:
                    type: string
                status:
                    type: string
                resetMfa:
                    type: boolean
                    description: Setting this resets MFA enrolment, forcing re-enrolment on next login.
        UserInvite:
            type: object
            properties:
                userId:
                    type: string
                email:
                    type: string
                setupToken:
                    type: string
                    description: |-
                        The one-time setup token. Returned ONCE, at issuance; only its hash is stored, so
                         an admin who loses it issues a new one rather than looking this one up.
                expiresAt:
                    type: string
                    format: date-time
        UserProfile:
            type: object
            properties:
                userId:
                    type: string
                email:
                    type: string
                role:
                    type: string
                    description: admin | analyst | auditor | ingest_only
                tenantId:
                    type: string
                tenantName:
                    type: string
                mfaEnabled:
                    type: boolean
                lastLoginAt:
                    type: string
                    format: date-time
                status:
                    type: string
                    description: |-
                        active | invited | disabled. `invited` means the account exists but has never had
                         a password its owner chose, and cannot sign in until a setup token is redeemed —
                         without this field an admin cannot tell that apart from an account that simply has
                         not logged in yet.
        VendorVerdict:
            type: object
            properties:
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                verdict:
                    enum:
                        - VERDICT_UNSPECIFIED
                        - VERDICT_ALLOWED
                        - VERDICT_BLOCKED
                        - VERDICT_CHALLENGED
                        - VERDICT_RATE_LIMITED
                        - VERDICT_MONITORED
                        - VERDICT_UNKNOWN
                    type: string
                    format: enum
                verdictReason:
                    type: string
                ruleId:
                    type: string
                ruleDescription:
                    type: string
                    description: The rule's name, resolved on read. See EventSummary.rule_description.
                ruleIds:
                    type: array
                    items:
                        type: string
                score:
                    type: number
                    description: Absent when the vendor does not score requests.
                    format: float
                scoreKind:
                    type: string
                eventId:
                    type: string
                eventTime:
                    type: string
                    format: date-time
            description: VendorVerdict is one vendor's contribution to a correlated request.
        VerdictPoint:
            type: object
            properties:
                bucket:
                    type: string
                    format: date-time
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                verdict:
                    enum:
                        - VERDICT_UNSPECIFIED
                        - VERDICT_ALLOWED
                        - VERDICT_BLOCKED
                        - VERDICT_CHALLENGED
                        - VERDICT_RATE_LIMITED
                        - VERDICT_MONITORED
                        - VERDICT_UNKNOWN
                    type: string
                    format: enum
                events:
                    type: string
            description: VerdictPoint is one vendor's verdict count in one bucket.
        VerifyMFARequest:
            type: object
            properties:
                mfaChallengeToken:
                    type: string
                code:
                    type: string
        VolumePoint:
            type: object
            properties:
                bucket:
                    type: string
                    format: date-time
                vendor:
                    enum:
                        - VENDOR_UNSPECIFIED
                        - VENDOR_CLOUDFLARE
                        - VENDOR_F5
                        - VENDOR_DATADOME
                        - VENDOR_NGINX
                    type: string
                    format: enum
                events:
                    type: string
            description: VolumePoint is one vendor's traffic in one bucket.
        WafCorroboration:
            type: object
            properties:
                ruleId:
                    type: string
                correlated:
                    type: string
                    description: |-
                        How many of the rule's requests joined another vendor's record at all. This is the
                         DENOMINATOR and the counts below cannot be read without it: two confirmations out
                         of two is a very different finding from two out of two hundred.
                confirmedByOthers:
                    type: string
                    description: |-
                        Records where a different vendor independently blocked or challenged. Evidence the
                         rule is catching something real.
                allowedByOthers:
                    type: string
                    description: Records every other vendor let through. The shape of a false positive.
        WafCoverageGap:
            type: object
            properties:
                requestHost:
                    type: string
                events:
                    type: string
                attackEvents:
                    type: string
                suspiciousEvents:
                    type: string
        WafCoverageGapPanel:
            type: object
            properties:
                gaps:
                    type: array
                    items:
                        $ref: '#/components/schemas/WafCoverageGap'
        WafDetail:
            type: object
            properties:
                attackScore:
                    type: integer
                    format: uint32
                sqliScore:
                    type: integer
                    format: uint32
                xssScore:
                    type: integer
                    format: uint32
                rceScore:
                    type: integer
                    format: uint32
                action:
                    type: string
                    description: |-
                        The vendor's verb, kept beside the verdict it collapses into. `log` is the one that
                         matters for tuning: the rule matched and was deliberately not enforced.
                source:
                    type: string
                    description: firewallManaged | firewallCustom | ip | bic. It decides HOW a rule is tuned.
            description: |-
                WafDetail is the vendor WAF's scoring and rule-engine attribution for one request.

                 THE SCORES ARE INVERTED relative to every other score in this API: 1 means certainly
                 an attack and 100 means certainly clean. 0 means the request was not scored, which is
                 distinct from scoring 0. Clients that rank by severity must sort ASCENDING on these.

                 The range is 1-100, not the 1-99 Cloudflare documents — it emits 100 for a
                 definitively clean request, and that is the most common value in real traffic.
        WafPathCount:
            type: object
            properties:
                requestHost:
                    type: string
                requestPath:
                    type: string
                events:
                    type: string
                meanScore:
                    type: number
                    format: double
        WafRulePathsPanel:
            type: object
            properties:
                paths:
                    type: array
                    items:
                        $ref: '#/components/schemas/WafPathCount'
        WafRuleProfile:
            type: object
            properties:
                ruleId:
                    type: string
                ruleDescription:
                    type: string
                    description: |-
                        What the rule is CALLED, resolved on read from the tenant's own rule table. Empty
                         when it cannot be named — no API token configured, or the rule has been deleted.
                requestHost:
                    type: string
                action:
                    type: string
                    description: |-
                        The vendor's own verb: log | skip | block | managedChallenge | allow. `log` is the
                         state a tuning decision acts on, and `skip` disables everything downstream of it.
                source:
                    type: string
                    description: |-
                        firewallManaged | firewallCustom. It decides HOW the rule is tuned: an override or
                         an exception, against an edit.
                events:
                    type: string
                attackEvents:
                    type: string
                    description: 'On the INVERTED attack-score scale: attack is 1-20, suspicious 21-50, clean above.'
                suspiciousEvents:
                    type: string
                cleanEvents:
                    type: string
                meanScore:
                    type: number
                    description: 0 when nothing in the group carried a score.
                    format: double
            description: |-
                WafRuleProfile is one rule's behaviour on one host.

                 THE SCORE SPLIT IS THE FINDING, not the total. A rule firing ten times on real
                 attacks and ninety times on clean traffic has a mean that reads as harmless; the
                 split says it works and is aimed too broadly. Clients should show the bands.
        WafRuleProfilePanel:
            type: object
            properties:
                rules:
                    type: array
                    items:
                        $ref: '#/components/schemas/WafRuleProfile'
tags:
    - name: Admin
    - name: Alerts
    - name: Auth
    - name: Correlation
      description: |-
        Per-tenant correlation tuning lives on the Admin service alongside retention and
         redaction, not here: it is a privileged configuration change, and splitting the
         tenant's settings across two services would split their authorization with them.
    - name: Dashboards
    - name: Feeds
    - name: Search
    - name: WafTuning
