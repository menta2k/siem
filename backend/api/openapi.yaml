                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Feed'
        delete:
            tags:
                - Feeds
            description: Soft-disables the feed. Ingested data is never removed by this operation.
            operationId: Feeds_DeleteFeed
            parameters:
                - name: feedId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteFeedResponse'
        patch:
            tags:
                - Feeds
            operationId: Feeds_UpdateFeed
            parameters:
                - name: feedId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateFeedRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Feed'
    /api/v1/feeds/{feedId}/health:
        get:
            tags:
                - Feeds
            operationId: Feeds_GetFeedHealth
            parameters:
                - name: feedId
