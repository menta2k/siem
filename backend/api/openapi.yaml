                                $ref: '#/components/schemas/ListFeedsResponse'
        post:
            tags:
                - Feeds
            description: The credential is accepted here, stored in the secret manager, and never echoed.
            operationId: Feeds_CreateFeed
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateFeedRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Feed'
    /api/v1/feeds/{feedId}:
        get:
            tags:
