                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedHealth'
    /api/v1/feeds/{feedId}/rejected:
        get:
            tags:
                - Feeds
            description: Dead-lettered events, so a rejected delivery is visible rather than silent.
            operationId: Feeds_ListRejectedEvents
            parameters:
                - name: feedId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: range.from
                  in: query
                  schema:
                    type: string
                    format: date-time
                - name: range.to
                  in: query
                  schema:
                    type: string
                    format: date-time
                - name: reasonCode
                  in: query
                  schema:
                    type: string
                - name: page.cursor
                  in: query
                  description: Opaque cursor from a previous PageResponse. Empty requests the first page.
                  schema:
                    type: string
                - name: page.limit
                  in: query
                  description: Server caps this at QUERY_MAX_RESULT_ROWS regardless of what is requested.
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListRejectedEventsResponse'
    /api/v1/feeds/{feedId}/test:
