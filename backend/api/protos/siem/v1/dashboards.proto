syntax = "proto3";

// Dashboard panels.
//
// Every panel accepts the same from/to/interval and is served from the rollup tables,
// never from raw events. Both properties are load-bearing: a shared range is what
// makes two figures on one screen comparable (FR-025), and reading rollups is what
// keeps a panel answerable at production volume.
package siem.v1;

option go_package = "github.com/menta2k/siem/api/gen/siem/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "siem/v1/common.proto";
// FeedHealth is defined with the feeds API and reused verbatim here, so the health
// tile on a dashboard and the one on the feeds page cannot drift apart.
import "siem/v1/feeds.proto";

service Dashboards {
  rpc GetOverview(DashboardRequest) returns (OverviewPanel) {
    option (google.api.http) = {get: "/api/v1/dashboards/overview"};
  }

  rpc GetRules(DashboardRequest) returns (RulesPanel) {
    option (google.api.http) = {get: "/api/v1/dashboards/rules"};
  }

  rpc GetSources(DashboardRequest) returns (SourcesPanel) {
    option (google.api.http) = {get: "/api/v1/dashboards/sources"};
  }

  rpc GetDisagreements(DashboardRequest) returns (DisagreementsPanel) {
    option (google.api.http) = {get: "/api/v1/dashboards/disagreements"};
  }

  rpc GetFeedHealthPanel(DashboardRequest) returns (FeedHealthPanel) {
    option (google.api.http) = {get: "/api/v1/dashboards/feed-health"};
  }

  // Storage headroom. ADMIN ONLY, unlike every other panel here: it describes the
  // cluster's disk rather than the tenant's traffic, and it is the same disk for every
  // tenant on it. An analyst has no action to take on it and no business seeing another
  // customer's contribution to it.
  rpc GetStorage(DashboardRequest) returns (StoragePanel) {
    option (google.api.http) = {get: "/api/v1/dashboards/storage"};
  }
}

// BucketInterval is the width of one point on a time series.
//
// A closed enum because the value reaches a SQL rounding function. This is the one
// position in a dashboard query that a bound parameter cannot protect, so the set of
// legal values is fixed here rather than validated downstream.
enum BucketInterval {
  BUCKET_INTERVAL_UNSPECIFIED = 0;
  BUCKET_INTERVAL_5M = 1;
  BUCKET_INTERVAL_1H = 2;
  BUCKET_INTERVAL_1D = 3;
}

message DashboardRequest {
  // Required, and shared by every panel so a range change moves them together.
  TimeRange time_range = 1;
  BucketInterval interval = 2;
  // Caps the rows a top-N panel returns.
  uint32 limit = 3;
}

// VolumePoint is one vendor's traffic in one bucket.
message VolumePoint {
  google.protobuf.Timestamp bucket = 1;
  Vendor vendor = 2;
  uint64 events = 3;
}

// VerdictPoint is one vendor's verdict count in one bucket.
message VerdictPoint {
  google.protobuf.Timestamp bucket = 1;
  Vendor vendor = 2;
  Verdict verdict = 3;
  uint64 events = 4;
}

message OverviewPanel {
  repeated VolumePoint volume = 1;
  repeated VerdictPoint verdicts = 2;
  // Totals for the whole range, so a headline figure does not require the client to
  // re-sum the series and risk disagreeing with it.
  uint64 total_events = 3;
  uint64 total_blocked = 4;
  uint64 total_challenged = 5;
}

message RuleCount {
  Vendor vendor = 1;
  string rule_id = 2;
  uint64 events = 3;
  // The rule's name, resolved on read. The panel this feeds is a ranking of opaque ids
  // without it, which is the least useful form of a top-ten list.
  string rule_description = 4;
}

message RulesPanel {
  repeated RuleCount rules = 1;
}

message SourceCount {
  string client_ip = 1;
  string country = 2;
  uint32 asn = 3;
  // The network's registered name. See ClientInfo.asn_owner for why it is resolved on
  // read rather than stored.
  string asn_owner = 6;
  uint64 events = 4;
  // A subset of events, never a separate tally: a source showing more blocks than
  // requests is nonsense an analyst cannot act on.
  uint64 blocked = 5;
}

// AsnCount is one origin network's activity for the range.
//
// The network behind the addresses, which is the level a lot of abuse is actually
// organised at. A botnet spread over a hosting provider shows as a thousand
// single-request addresses in the top-sources table and never reaches it; aggregated by
// ASN the same traffic is one row near the top.
message AsnCount {
  uint32 asn = 1;
  // The network's registered name, e.g. "VIVACOM-AS". Empty when the published table
  // does not list the number, in which case the console shows the bare ASN.
  string owner = 6;
  // The country most of this network's traffic came from. An ASN can span several, so
  // this names the majority rather than claiming the network sits in one place.
  string country = 2;
  uint64 events = 3;
  // A subset of events, never a separate tally.
  uint64 blocked = 4;
  // Distinct client addresses seen on this network. The number that separates one busy
  // client from a distributed source: 50,000 events from 3 addresses and from 30,000
  // addresses are different problems with different responses.
  uint64 clients = 5;
}

message SourcesPanel {
  repeated SourceCount sources = 1;
  // The same traffic aggregated by origin network. Carried on this panel rather than
  // its own so one request serves both views and they cannot disagree about the range.
  repeated AsnCount asns = 2;
}

// TableSize is how much disk one table occupies.
message TableSize {
  string table = 1;
  uint64 bytes = 2;
  uint64 rows = 3;
}

// StoragePanel answers "how long until we run out of disk".
message StoragePanel {
  // The filesystem ClickHouse writes to.
  uint64 disk_total_bytes = 1;
  uint64 disk_free_bytes = 2;
  // What this platform's own database occupies, which is NOT total minus free: the disk
  // may hold anything else the host puts there, and reporting the difference as ours
  // would blame the platform for someone else's files.
  uint64 database_bytes = 3;

  // Average bytes written per day, measured over whole days only.
  uint64 bytes_per_day = 4;
  // How many whole days that average is based on. A projection from one day is a guess
  // and the console has to be able to say so.
  uint32 measured_days = 5;

  // Days until the disk is full at the measured rate. Zero when growth is zero or
  // negative -- which is the expected steady state once retention starts expiring as
  // much as ingestion writes, not an error.
  double days_remaining = 6;
  // True once expiry offsets ingestion, meaning days_remaining is not meaningful.
  bool steady = 7;

  repeated TableSize tables = 8;
}

message DisagreementPoint {
  google.protobuf.Timestamp bucket = 1;
  DisagreementKind kind = 2;
  uint64 records = 3;
  // Every correlated request in the bucket. Carried alongside the numerator so a rate
  // can be computed from one row rather than by dividing figures fetched separately,
  // which is how two panels on one screen end up disagreeing.
  uint64 total = 4;
}

message DisagreementsPanel {
  repeated DisagreementPoint points = 1;
  uint64 total_records = 2;
  uint64 total_disagreements = 3;
}

message FeedHealthPanel {
  repeated FeedHealth feeds = 1;
}
