name: CI

on:
  push: { branches: [main] }
  pull_request:

# Constitution: the gates below are all blocking. A red gate blocks the merge.
env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: backend/go.sum }
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with: { version: latest, working-directory: backend }
      - name: buf lint
        working-directory: backend
        run: buf lint
      - name: buf breaking
        working-directory: backend
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=backend" || true

  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - run: make -C backend init
      - run: cd frontend && npm ci
      # Principle I: the contract and the code cannot drift apart.
      - run: make api-check

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: backend/go.sum }
      - name: Unit tests + 80% coverage gate
        run: make test-unit
      - name: Integration tests (testcontainers)
        run: make test-integration
      - name: Contract tests
        run: make test-contract
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-coverage, path: backend/coverage.out }

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: backend/go.sum }
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...
      - name: npm audit
        run: cd frontend && npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  build:
    needs: [lint, contract-drift, test-backend, test-frontend, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: make build
