# Production stack. Used INSTEAD of docker-compose.yml, not as an override:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# The development file is not safe to deploy. It publishes ClickHouse, Redpanda and
# Redis on every interface so a developer can reach them from the host — on a public
# server that exposes the entire event store and the broker to the internet. It also
# runs the web UI through the Vite dev server, which ships unminified sources and a file
# watcher. Both are correct for a laptop and wrong for a host with a public address.
name: siem

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- infrastructure
  #
  # None of these publish a host port. They are reachable only over the compose network,
  # by the services that need them. Reaching ClickHouse from the host is
  #   docker compose -f docker-compose.prod.yml exec clickhouse clickhouse-client ...
  # which requires shell access to the box, exactly as it should.
  clickhouse:
    <<: *restart
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-siem}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-siem}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/config:/etc/clickhouse-server/config.d:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://$$(hostname -i | cut -d' ' -f1):8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  redpanda:
    <<: *restart
    image: redpandadata/redpanda:v24.2.9
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
      - --check=false
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    <<: *restart
    image: redis:7.4-alpine
    # noeviction is deliberate. Redis holds correlation windows in flight; evicting them
    # under memory pressure would silently drop joins rather than fail loudly.
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------- services
  siem-api:
    <<: *restart
    # Pulled, not built. build: stays so the stack can still be rebuilt in place, but a
    # deployment uses the image CI published — this host has one core, and compiling
    # here would also mean pulling the whole Go and Node toolchain to do it.
    image: ${REGISTRY:-ghcr.io/menta2k/siem}/siem-api:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args: { SERVICE: siem-api, APP_VERSION: "${APP_VERSION:-dev}" }
    env_file: [.env]
    # No host port. The web tier proxies /api to it over the compose network, so the
    # analyst-facing API is never directly addressable from outside.
    expose: ["8000"]
    depends_on:
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app/service", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10

  siem-ingest:
    <<: *restart
    # Pulled, not built. build: stays so the stack can still be rebuilt in place, but a
    # deployment uses the image CI published — this host has one core, and compiling
    # here would also mean pulling the whole Go and Node toolchain to do it.
    image: ${REGISTRY:-ghcr.io/menta2k/siem}/siem-ingest:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args: { SERVICE: siem-ingest, APP_VERSION: "${APP_VERSION:-dev}" }
    env_file: [.env]
    # Published: this is where the vendors deliver. Kept on its own port rather than
    # behind the web tier so a delivery flood cannot starve the analyst UI.
    ports:
      - "${INGEST_PUBLISH_ADDR:-0.0.0.0}:${INGEST_HTTP_PORT:-8001}:8001"
    depends_on:
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }

  siem-processor:
    <<: *restart
    # Pulled, not built. build: stays so the stack can still be rebuilt in place, but a
    # deployment uses the image CI published — this host has one core, and compiling
    # here would also mean pulling the whole Go and Node toolchain to do it.
    image: ${REGISTRY:-ghcr.io/menta2k/siem}/siem-processor:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args: { SERVICE: siem-processor, APP_VERSION: "${APP_VERSION:-dev}" }
    env_file: [.env]
    expose: ["8002"]
    depends_on:
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }

  # ---------------------------------------------------------------- web
  frontend:
    <<: *restart
    image: ${REGISTRY:-ghcr.io/menta2k/siem}/siem-frontend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    environment:
      API_UPSTREAM: http://siem-api:8000
      INGEST_UPSTREAM: http://siem-ingest:8001
      DNS_RESOLVER: 127.0.0.11
    ports:
      - "${WEB_PUBLISH_ADDR:-0.0.0.0}:${WEB_HTTP_PORT:-80}:8080"
    depends_on: [siem-api, siem-ingest]

  # ---------------------------------------------------------------- edge
  #
  # Cloudflare Tunnel. cloudflared dials OUT to Cloudflare and serves the console over
  # that connection, so the origin needs no inbound port, no public address and no
  # certificate of its own — and cannot return a 522, because there is nothing for
  # Cloudflare to fail to reach.
  #
  # It is reached at frontend:8080, which already routes /api to the API and /ingest to
  # the receiver, so ONE public hostname covers the console, the contract surface and
  # vendor delivery. Configure that in the tunnel's Public Hostname:
  #
  #     siem.server-lab.eu  ->  http://frontend:8080
  #
  # Enabled with a profile so the stack still starts without a token; a cloudflared with
  # no credentials would otherwise crash-loop and bury the real logs.
  cloudflared:
    <<: *restart
    image: cloudflare/cloudflared:2026.7.3
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # Plain interpolation for the same reason as the collector below: `:?` is evaluated
      # for every service at parse time, so requiring it here breaks `compose ps`, `logs`
      # and `exec` on any host that is not running the tunnel. The profile keeps this out
      # of a default `up`, and cloudflared exits loudly on an empty token.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN-}
    # Outbound only. Deliberately no ports: publishing one would defeat the point.
    depends_on: [frontend]

  # ---------------------------------------------------------------- BIG-IP collector
  #
  # BIG-IP ASM can only ship logs over syslog — a Logging Profile offers TCP, UDP and
  # TCP-RFC3195, never HTTP — so this translates syslog into authenticated HTTPS.
  #
  # It reaches siem-ingest over the COMPOSE NETWORK, not through Cloudflare: once a log
  # line is on this host there is no reason to send it out to the edge and back.
  #
  # The syslog port is the one inbound port on an otherwise closed host, and syslog has
  # no authentication whatsoever — anything that can reach it can forge WAF events into
  # the SIEM. Restrict it to BIG-IP's address at the firewall; SYSLOG_BIND alone only
  # chooses an interface, it does not filter callers.
  vector:
    <<: *restart
    image: timberio/vector:0.44.0-alpine
    profiles: ["bigip"]
    environment:
      # Plain interpolation, NOT `:?`. Compose evaluates `:?` for every service when it
      # parses the file — including services outside the active profile — so a required
      # variable here would break `compose ps`, `logs` and `exec` for the whole stack on
      # any host not running the collector. vector.yaml declares them required instead,
      # so the container refuses to start rather than silently dropping every delivery.
      SIEM_INGEST_URL: ${F5_INGEST_URL-}
      SIEM_FEED_TOKEN: ${F5_FEED_TOKEN-}
      # BIG-IP's appliance UTC offset; see deploy/vector/.env.example.
      BIGIP_UTC_OFFSET: ${BIGIP_UTC_OFFSET:-+0000}
    ports:
      - "${SYSLOG_BIND:-127.0.0.1}:${SYSLOG_PORT:-5514}:5514"
    volumes:
      - ./deploy/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/var/lib/vector
    depends_on: [siem-ingest]

volumes:
  clickhouse-data:
  redpanda-data:
  redis-data:
  vector-data:
